name: ci
on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: the "pin rollback" label turns the pin check off
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    # Ubuntu 26.04's own GCC 16 (16-20260322 and later) ships <simd> (C++26 std::simd); the
    # toolchain PPA's GCC 16 for 24.04 is an older snapshot without it.
    container:
      image: ubuntu:26.04
      # A real init as PID 1 reaps orphans, as systemd does on a host: smoke_serve SIGKILLs
      # serve and checks that its backend is gone, and without a reaper the exited backend
      # stays a zombie that kill -0 still finds.
      options: --init
    steps:
      - name: Tools for checkout and the build
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git \
            python3 python3-venv curl jq file procps make gcc-16 g++-16 cmake ninja-build libcurl4-openssl-dev libzstd-dev \
            libssl-dev libdrm-dev libpcre2-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /opt/ci-venv && echo /opt/ci-venv/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copyright notice on every file
        run: python3 tools/copyright.py --check
      - name: Submodule pins only move forward
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'pin rollback')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          python3 tools/check_pins.py "$BASE"
      # engine #963 option 2: the NPU chat route renders the container's own chat template with the pinned
      # llama.cpp fork's Jinja engine (app/npu_template.h), so the build needs that submodule's sources —
      # shallow, one checkout, ~180 MB, 8 s, and it is the same commit the release build compiles. Without it
      # CMake's ONEBIT_JINJA defaults off and `npu_template` would skip, i.e. the renderer would reach a green
      # build without ever being compiled.
      - name: The llama.cpp sources the chat-template renderer compiles
        run: git submodule update --init --depth 1 third_party/llama.cpp
      - name: GGUF -> Q4NX repack, ternary -> Q4_0, MTP draft vocabulary
        run: |
          python3 -m pip install numpy gguf
          python3 tests/gguf_to_q4nx_test.py
          python3 tests/repack_verify_source_test.py
          python3 tests/ternary_to_q4_0_test.py
          python3 tests/mtp_draft_vocab_test.py
          python3 tests/check_pins_test.py
          python3 tests/hrx_long_prompt_test.py
          python3 tools/template_bom.py --self-test          # the chat-template BOM component
      - name: Model pins
        # fixtures only: models/pins.json itself is compared with the Hub by pin-watch.yml
        run: python3 tools/pin_watch.py --self-test
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16
      - name: The draft-loop measurement tool still compiles
        # tools/mtp_acceptance is the binary every draft-loop number is measured with, and it is not a
        # build target here: it links the NPU forward, whose runtime is private (ONEBIT_NPU wants
        # ONEBIT_NPU_RT_DIR). A rename in npu/mtp/ or npu/forward/include/ would therefore break it
        # silently until someone built it on a device. Syntax-only, against the in-tree headers only.
        run: |
          # The image installs versioned binaries only (no /usr/bin/g++), and Configure above
          # already picks g++-16, so the check compiles with the same compiler the build uses.
          g++-16 -std=c++26 -fsyntax-only -DONEBIT_NPU_RUNTIME_OWN \
            -Inpu -Inpu/forward/include -Ibuild/_deps/json-src/include \
            tools/mtp_acceptance.cpp
      - name: The forward defines every step_batch_embeds overload the header declares
        # `embeds_equiv_probe` cannot be built in this job: it lives under `if(ONEBIT_NPU)` (CMakeLists.txt),
        # and this workflow configures without it because the NPU runtime is private. Adding an unknown target
        # to `cmake --build --target ...` is a hard ninja error, so that is not the way to guard it. What this
        # job DOES build is `onebit_npu_forward_syntax`, an OBJECT library that compiles q4nx_forward.cpp and
        # links nothing -- so the object can be built here, and the invariant that broke on 2026-11-08 (the three-argument
        # `step_batch_embeds` was declared in the header and never defined, so `embeds_equiv_probe` failed to
        # link while every CI job stayed green) is checkable against it without the NPU configuration.
        run: |
          # Built explicitly rather than relied on transitively: it IS built by the step above, because
          # CMakeLists.txt:542 has `add_dependencies(onebit onebit_npu_forward_syntax)` -- but a check that
          # depends on the order of another step's target list is the kind that goes quiet when that list is
          # edited. One line here makes the object's existence this step's own precondition.
          cmake --build build --target onebit_npu_forward_syntax
          OBJ=$(find build -name 'q4nx_forward.cpp.o' -path '*onebit_npu_forward_syntax*' | head -1)
          test -n "$OBJ" || { echo "the forward syntax object was not built"; exit 1; }
          decl=$(grep -c 'bool step_batch_embeds(' npu/forward/include/q4nx_forward.h)
          def=$(nm -C "$OBJ" | grep -c ' T Q4nxNpuForward::step_batch_embeds')
          echo "$OBJ: $def definition(s) of Q4nxNpuForward::step_batch_embeds, $decl declared"
          if [ "$def" -lt "$decl" ]; then
            echo "a declared overload has no definition: anything that calls it fails to link, and this job's"
            echo "own targets never do (that is how a red main survived). Counted above."
            exit 1
          fi
      - name: The embedding probe still compiles against the in-tree headers
        # The probe itself cannot be built here (see above), but it must keep compiling: this catches the probe
        # drifting from the forward's interface, which the symbol check above would not.
        run: |
          g++-16 -std=c++26 -fsyntax-only -DONEBIT_NPU_RUNTIME_OWN \
            -Inpu -Inpu/forward/include -Ibuild/_deps/json-src/include \
            npu/forward/embeds_equiv_probe.cpp
      - name: Build
        # Every target a ctest test invokes must be listed here: `ctest` runs whatever
        # binaries exist, so a test whose target is missing reports "Not Run" and never
        # executes. Keep this list in step with add_test() in CMakeLists.txt.
        run: |
          cmake --build build --target onebit \
            npu_full_elf_test npu_pack_test npu_q4nx_test npu_private_route_test \
            npu_pack_import_test \
            tokenizer_test think_split_test gguf_meta_test mem_admit_test pm_routes_test \
            laya_encoder_test http_guard_test moe_gguf_index_test laya_bounds_test \
            npu_model_bounds_test npu_forward_loader_test npu_design_grid_test npu_sampling_test \
            npu_flm_head_import_test npu_elf_args_test \
            npu_template_test npu_chatml_test \
            tokenizer_linear_test hrx_placement_test hrx_cwsr_test hrx_runtime_test npu_device_lock_test -j
      - name: Test
        # One hung test must not hold the job for hours: each test gets 10 minutes.
        run: ctest --test-dir build --output-on-failure --timeout 600
