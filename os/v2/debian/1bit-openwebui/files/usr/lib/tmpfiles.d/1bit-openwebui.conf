# OpenWebUI's data on the partition an install keeps (os/v2's 1BIT-DATA), created before the unit
# starts even on a box whose first OpenWebUI start comes before anything else touched it. Only the
# generated key/session file lives in /etc; the container image stays under /var/lib/containers.
d /data/openwebui 0700 root root - -
