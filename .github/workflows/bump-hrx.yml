#
# Keep third_party/llama.cpp and third_party/hrx-system current with the pair AMD's
# integration repo (ROCm/ggml-staging-automation) builds and tests together, while the engine
# stays on OUR HRX line (docs/hrx.md, "Staying current"). The engine pins
# 1bit/hrx-vulkan-patched: AMD's commits plus our own. When AMD moves its pins, this workflow
# (scripts/bump-hrx-sync.sh does the fork side and can be run locally with DRY_RUN=1):
#   1. moves 1bit/hrx-vulkan, our mirror of AMD's pin, to AMD's pin. If AMD rewrote its history
#      (2026-10-10: 141 commits squashed into one), the old mirror tip is tagged first, and the
#      run fails if the mirror held any commit that is on no AMD branch;
#   2. MERGES AMD's pin into 1bit/hrx-vulkan-patched, tagging the previous tip so the commit the
#      engine pins stays reachable. While config/hrx-system-hold.config names a commit, only
#      AMD's changes outside the HRX backend are taken (AMD's ggml-hrx is written against AMD's
#      hrx-system) and hrx-system is not merged at all;
#   3. opens a PR here when either submodule has something new.
#
# Why a merge and not a rebase (measured 2026-10-06): our patched line carries 159 of our own
# commits and AMD's pin had moved 70 commits, over the same files. Rebasing replays all 159 and
# died at commit 1 of 159 (dispatch-mul-mat.cpp). Merging the same two lines conflicts only under
# ggml/src/ggml-hrx/, and the merge resolves those toward our patched line (measured: AMD core +
# our ggml-hrx passes the full HRX0 gate with 0 NaN; AMD's ggml-hrx fails 54 cases and yields
# NaN, engine#315). A conflict outside ggml/src/ggml-hrx, or in hrx-system, still fails the run
# and names the files: resolve those by hand.
#
# The hold (engine#388): the owner keeps the engine on our HRX line (2026-10-10). AMD's
# hrx-system after 98d05d94 miscompiles long-context attention (ROCm/hrx-system#1535), so
# hrx-system stays at 98d05d94. Before the hold existed, every scheduled run from 2026-10-09
# failed at the mirror step instead of reporting it.
# A failed run now files an issue, so it cannot break silently for another five days.
# GitHub-hosted CI builds that PR without HRX; run tests/serve_e2e.sh on
# Strix Halo before merging it.
#
# Needs the secret HRX_BUMP_TOKEN: a fine-grained token with Contents
# read/write on 1bit-MONSTER/llama.cpp and 1bit-MONSTER/engine, Workflows
# read/write on 1bit-MONSTER/llama.cpp, and Pull requests read/write on
# 1bit-MONSTER/engine. Syncing upstream can update workflow files, which needs
# the Workflows permission. (A PR opened with the default GITHUB_TOKEN would
# not start CI, and that token cannot push to the fork.)
name: bump-hrx

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bump-hrx
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}
          persist-credentials: true

      - name: Read AMD's tested pair and ours
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          amd_llama=$(gh api repos/ROCm/ggml-staging-automation/contents/llama.cpp --jq .sha)
          amd_hrx=$(gh api repos/ROCm/ggml-staging-automation/contents/hrx-system --jq .sha)
          ours_llama=$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')
          ours_hrx=$(git ls-tree HEAD third_party/hrx-system | awk '{print $3}')
          # the AMD commit our patches sit on
          ours_base=$(git ls-remote https://github.com/1bit-MONSTER/llama.cpp.git refs/heads/1bit/hrx-vulkan | awk '{print $1}')
          echo "AMD:  llama.cpp $amd_llama  hrx-system $amd_hrx"
          echo "ours: llama.cpp $ours_llama (on AMD $ours_base)  hrx-system $ours_hrx"
          {
            echo "amd_llama=$amd_llama"; echo "amd_hrx=$amd_hrx"
            echo "ours_llama=$ours_llama"; echo "ours_hrx=$ours_hrx"; echo "ours_base=$ours_base"
            if [ "$amd_llama" = "$ours_base" ] && [ "$amd_hrx" = "$ours_hrx" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Sync the fork and merge AMD's pin into our line
        id: fork
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          AMD_LLAMA: ${{ steps.pins.outputs.amd_llama }}
          OURS_LLAMA: ${{ steps.pins.outputs.ours_llama }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: scripts/bump-hrx-sync.sh llama

      # hrx-system is the OTHER HALF of AMD's tested pair. The engine pins our fork's 1bit/main
      # (ROCm/hrx-system at AMD's pin plus our commits). Same merge-not-rebase treatment as
      # llama.cpp above, unless config/hrx-system-hold.config holds it.
      - name: Merge AMD's hrx-system pin into our line
        id: hrxfork
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          AMD_HRX: ${{ steps.pins.outputs.amd_hrx }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: scripts/bump-hrx-sync.sh hrx

      # Our ggml-hrx backend (ggml/src/ggml-hrx in the llama.cpp fork) is compiled against the LoomC
      # headers of hrx-system. AMD removes public LoomC symbols without notice (2026-10-07: loom 32d0c76a
      # dropped loomc_amdgpu_runtime_global_flags_t and loomc_amdgpu_emit_options_t, used by our
      # loom-jit.cpp). CI here builds without HRX, so #353, #357 and #361 merged a pair that did not
      # compile with ONEBIT_HRX=ON, and #359 / #363 had to pin hrx-system back by hand (KNOWN-ISSUES.md).
      # Cheap header-level check: every loomc_* / LOOMC_* identifier our backend uses must still be
      # declared under loom/binding/c/include at the new hrx-system revision. If one is missing, the PR
      # moves llama.cpp only and keeps hrx-system where it is, and says so.
      - name: Hold hrx-system if our ggml-hrx uses LoomC symbols the new revision dropped
        id: compat
        if: steps.pins.outputs.changed == 'true'
        env:
          REBASED: ${{ steps.fork.outputs.rebased }}
          HRX_REBASED: ${{ steps.hrxfork.outputs.hrx_rebased }}
          HRX_POLICY_HELD: ${{ steps.hrxfork.outputs.held }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: |
          set -euo pipefail
          hrx_pin="$HRX_REBASED"
          held="$HRX_POLICY_HELD"
          if [ "$HRX_REBASED" != "$OURS_HRX" ]; then
            used=$(cd patched && git ls-tree -r --name-only "$REBASED" -- ggml/src/ggml-hrx \
              | grep -E '\.(c|cc|cpp|h|hpp)$' \
              | while read -r f; do git show "$REBASED:$f"; done \
              | grep -oE '\b(loomc_[A-Za-z0-9_]+|LOOMC_[A-Z0-9_]+)\b' | sort -u)
            headers=$(cd hrxsystem && git ls-tree -r --name-only "$HRX_REBASED" -- loom/binding/c/include \
              | while read -r f; do git show "$HRX_REBASED:$f"; done)
            missing=""
            for sym in $used; do
              printf '%s\n' "$headers" | grep -qF -- "$sym" || missing="$missing $sym"
            done
            if [ -n "$missing" ]; then
              echo "::warning::hrx-system ${HRX_REBASED:0:12} no longer declares:${missing}. Keeping third_party/hrx-system at ${OURS_HRX:0:12} until ggml-hrx is ported (KNOWN-ISSUES.md, engine#359/#363)."
              hrx_pin="$OURS_HRX"
              held="hrx-system HELD at \`${OURS_HRX:0:12}\`: our ggml-hrx still uses LoomC symbols that \`${HRX_REBASED:0:12}\` dropped (${missing## }). Port ggml/src/ggml-hrx first, then move it."
            else
              echo "every LoomC symbol our ggml-hrx uses ($(printf '%s\n' $used | wc -l)) is declared at hrx-system ${HRX_REBASED:0:12}"
            fi
          fi
          {
            echo "hrx_pin=$hrx_pin"
            echo "held=$held"
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          AMD_LLAMA: ${{ steps.pins.outputs.amd_llama }}
          AMD_HRX: ${{ steps.pins.outputs.amd_hrx }}
          REBASED: ${{ steps.fork.outputs.rebased }}
          HRX_REBASED: ${{ steps.compat.outputs.hrx_pin }}
          HRX_HELD: ${{ steps.compat.outputs.held }}
          PATCHES: ${{ steps.fork.outputs.patches }}
          OURS_LLAMA: ${{ steps.pins.outputs.ours_llama }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: |
          set -euo pipefail
          if [ "$REBASED" = "$OURS_LLAMA" ] && [ "$HRX_REBASED" = "$OURS_HRX" ]; then
            echo "::notice::nothing to move: llama.cpp stays at ${OURS_LLAMA:0:12}, hrx-system at ${OURS_HRX:0:12}"
            exit 0
          fi
          title="Bump HRX: llama.cpp ${REBASED:0:12} + hrx-system ${HRX_REBASED:0:12}"
          branch="bump-hrx/${REBASED:0:12}-${HRX_REBASED:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "::notice::$branch already exists"; exit 0
          fi
          git config user.name "hrx-bump"
          git config user.email "hrx-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$REBASED,third_party/llama.cpp"
          git update-index --cacheinfo "160000,$HRX_REBASED,third_party/hrx-system"
          git commit -q -m "$title"
          scripts/registry-regen.sh  # the registry must record the new pin (ctest registry_pins)
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Moves the HRX submodules along our line. AMD's tested pair (ROCm/ggml-staging-automation) is llama.cpp \`${AMD_LLAMA:0:12}\` + hrx-system \`${AMD_HRX:0:12}\`; the workflow merges it into our branches (a conflict fails the run and names the files).

          | | from | to |
          |---|---|---|
          | third_party/llama.cpp (1bit-MONSTER/llama.cpp 1bit/hrx-vulkan-patched) | \`${OURS_LLAMA:0:12}\` | \`${REBASED:0:12}\` |
          | third_party/hrx-system (1bit-MONSTER/hrx-system 1bit/main) | \`${OURS_HRX:0:12}\` | \`${HRX_REBASED:0:12}\` |

          ${HRX_HELD}

          llama.cpp commits new to the engine:
          ${PATCHES}

          CI here builds without HRX. Before merging, on Strix Halo run the long-prompt correctness
          probe and \`test-backend-ops -b HRX0\`; record the exact validated hrx-system pin in
          \`config/hrx-long-prompt-validated-pin.config\`:
          \`python3 tests/hrx_long_prompt.py\`
          \`cmake -B build -G Ninja -DONEBIT_HRX=ON && cmake --build build --target onebit && for d in hrx cpu; do tests/serve_e2e.sh build/1bit <Qwen3-0.6B Q4_K_M .gguf> \$d; done\`"

      # This workflow failed on EVERY scheduled run from 2026-10-01 to 2026-10-05 and nobody
      # noticed, so the HRX pin silently froze at the old commit. A failing scheduled job that
      # tells no one is the actual defect; this step makes it speak.
      - name: Report a failed sync so it cannot break silently
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}   # least privilege: no PAT needed to speak in this repo
        run: |
          set -euo pipefail
          title="bump-hrx: the scheduled HRX pin sync is failing"
          body="The bump-hrx run $GITHUB_RUN_ID failed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Look at the sync steps ('Sync the fork and merge AMD's pin into our line', 'Merge AMD's hrx-system pin into our line'). If one is a merge conflict, the conflicting files are named in the log; resolve them by hand on \`1bit/hrx-vulkan-patched\` or on \`1bit-MONSTER/hrx-system\` \`1bit/main\`, then re-run this workflow.

          Why this step exists: bump-hrx failed on every scheduled run from 2026-10-01 to 2026-10-05 without anyone noticing, and the HRX pin silently froze."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
