#
# PR-Agent (The-PR-Agent/pr-agent, formerly qodo-ai/pr-agent) reviews every pull request with a local model: Qwen3-Coder-30B-A3B
# (Q4_K_M, about 18 GB resident, thinking off) served by the engine itself (`1bit serve`; it ran on Vulkan, which RFC #213 stage 3 removes: the service moves to HRX) on
# the Strix Halo box, at 127.0.0.1:8090 (the coder-llm user service). The job runs on that box's self-hosted runner
# (label pr-agent), so no code leaves it and there is no API key. Settings: .pr_agent.toml.
#
# Opened/updated PRs get a review. A trusted comment runs a command: /review, /describe (rewrites
# the PR title and description, so only on request), /improve or /ask <question>.
name: pr-agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent:
    runs-on: [self-hosted, pr-agent]
    # on the job, not the workflow: a comment that skips the job (a bot's, say) must not cancel a review
    concurrency:
      # A comment and a push are different jobs on one serialised model runner: an `/ask` must not cancel the review of
      # the PR it is asked about, and a `synchronize` must cancel the review of the head it replaced. Grouping by event
      # name keeps push-cancels-push (right: a newer head makes the older review moot) without letting a busy thread
      # starve it. Measured 2026-11-10: PR #2007's review ran 19:21:26 -> cancelled 19:30:31, and `issue_comment:
      # [created]` puts every comment on the PR into this same group with `cancel-in-progress: true`.
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
      cancel-in-progress: true
    timeout-minutes: 30
    # same-repo PRs, and comments by the owner, members or collaborators on a pull request
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PR-Agent
        env:
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          # the model settings are here too: PR-Agent reads .pr_agent.toml from the default branch only
          CONFIG__MODEL: openai/qwen3-coder
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '65536'
          OPENAI__API_BASE: http://127.0.0.1:8090/v1
          OPENAI__KEY: local
        run: |
          set -e
          # PR-Agent from https://github.com/The-PR-Agent/pr-agent (PyPI pr-agent), one venv per version on the
          # runner so a version bump installs fresh instead of reusing the old one. Since 0.49 the GitHub provider
          # is an extra: without [github] every command fails with "Git provider 'github' could not be loaded".
          PRA_VERSION=0.49.0
          venv="$HOME/pr-agent-venv-$PRA_VERSION"
          export PATH="$venv/bin:$PATH"
          if ! "$venv/bin/pr-agent" --help > /dev/null 2>&1; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install -q "pr-agent[github]==$PRA_VERSION"
          fi
          # a real one-token completion, not just /v1/models: the server answers that before the model is loaded
          ready=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 60 http://127.0.0.1:8090/v1/chat/completions -H 'Content-Type: application/json' \
                 -d '{"model":"qwen3-coder","messages":[{"role":"user","content":"ok"}],"max_tokens":1}' > /dev/null; then
              ready=1; break
            fi
            sleep 10
          done
          [ "$ready" = 1 ] || { echo "::error::the local model (coder-llm on :8090) does not answer"; exit 1; }
          # PR-Agent exits 0 even when every model call failed or the command never ran, so check its log
          run() {
            pr-agent --pr_url "$pr" "$@" 2>&1 | tee "$RUNNER_TEMP/pr-agent.log"
            if grep -qE "Failed to generate prediction|Error during LLM inference|Failed to (review|describe|generate|process the command)|Failed to get git provider" "$RUNNER_TEMP/pr-agent.log"; then
              echo "::error::PR-Agent failed (no model answer, or the command never ran): see the log above"; exit 1
            fi
          }
          pr="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run review
          else
            cmd=$(printf '%s' "$COMMENT_BODY" | sed -E 's/^[[:space:]]*\/?//; s/[[:space:]].*//' | tr '[:upper:]' '[:lower:]')
            case "$cmd" in
              review)   run review ;;
              describe) run describe ;;
              improve)  run improve ;;
              ask)      run ask "$(printf '%s' "$COMMENT_BODY" | sed -E 's/^[[:space:]]*\/?ask[[:space:]]*//')" ;;
              *)        echo "not a PR-Agent command: $cmd" ;;
            esac
          fi
