#
# Keep third_party/ds4 on upstream antirez/ds4 main (docs/dwarfstar.md). The submodule is
# our fork 1bit-MONSTER/ds4, branch 1bit/main: upstream main plus the commits we carry (1BP
# packages, docs/1BP.md in the fork). When upstream main moves, this workflow merges it into
# 1bit/main, the way sync-lemonade-fork.yml merges upstream's release into the Lemonade fork,
# and pushes the merge commit: the old tip stays an ancestor of the new one, so the engine's
# tools/check_pins.py ("pins only move forward") is satisfied and no pin is ever rewritten.
# It tags the old tip ds4-main-<sha12> so pinned commits stay reachable, and opens a PR here
# moving the submodule. A merge conflict, or a merge that drops the files we carry, stops the
# bump for a hand merge and pushes nothing.
#
# Until 2026-10-16 this workflow rebased our commits onto upstream and force-pushed, so every
# bump PR pinned a rewritten commit, which check_pins.py reads as "diverged" and refuses;
# #429 is such a pin and needed the "pin rollback" label. GitHub-hosted CI has no GPU; run the
# checks in the PR body on Strix Halo before merging.
#
# Uses the secret HRX_BUMP_TOKEN (Contents read/write on 1bit-MONSTER/ds4 and
# 1bit-MONSTER/engine, Pull requests read/write on 1bit-MONSTER/engine): a PR opened with the
# default GITHUB_TOKEN would not start CI, and that token cannot push to the fork.
name: bump-ds4

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write            # the failure step files/refreshes an issue (see the last step)

concurrency:
  group: bump-ds4
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with upstream
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/antirez/ds4/commits/main --jq .sha)
          ours=$(git ls-tree HEAD third_party/ds4 | awk '{print $3}')
          # where our commits branch off antirez's history (the fork shares its object network)
          ours_base=$(gh api "repos/antirez/ds4/compare/${upstream}...${ours}" --jq .merge_base_commit.sha)
          echo "upstream ${upstream}, ours ${ours} on ${ours_base}"
          {
            echo "upstream=$upstream"; echo "ours=$ours"; echo "ours_base=$ours_base"
            if [ "$upstream" = "$ours_base" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream into our 1bit/main
        id: fork
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          OURS: ${{ steps.pins.outputs.ours }}
        run: |
          set -euo pipefail
          # the fork's main mirrors antirez/ds4 main
          gh api -X POST repos/1bit-MONSTER/ds4/merge-upstream -f branch=main > /dev/null
          git clone -q --filter=blob:none "https://x-access-token:${TOKEN}@github.com/1bit-MONSTER/ds4.git" fork
          cd fork
          git config user.name "ds4-bump"
          git config user.email "ds4-bump@users.noreply.github.com"
          git remote add upstream https://github.com/antirez/ds4.git
          git fetch -q upstream "$UPSTREAM"
          git switch -q -C 1bit/main origin/1bit/main
          carried=$(git rev-parse HEAD)
          if [ "$carried" != "$OURS" ]; then
            echo "::error::1bit/main (${carried:0:12}) is not the engine's pin (${OURS:0:12}); reconcile them by hand"
            exit 1
          fi
          # A conflict is for a person: no auto-resolution, and nothing is pushed.
          if ! git merge -q --no-commit --no-ff "$UPSTREAM"; then
            conflicts=$(git diff --name-only --diff-filter=U | paste -sd, -)
            git merge --abort
            echo "::error::antirez/ds4 ${UPSTREAM:0:12} does not merge cleanly into 1bit/main (${conflicts}); merge it by hand"
            exit 1
          fi
          # The fork exists for the 1BP packages: never push a merge that lost them.
          for f in ds4_onebp.inc docs/1BP.md; do
            [ -f "$f" ] || { echo "::error::$f is gone after the merge"; git merge --abort; exit 1; }
          done
          compgen -G 'gguf-tools/*1bp*' > /dev/null || { echo "::error::the 1BP tools are gone after the merge"; git merge --abort; exit 1; }
          grep -q 'ds4_onebp.inc' ds4.c || { echo "::error::ds4.c no longer includes ds4_onebp.inc"; git merge --abort; exit 1; }
          git commit -q -m "Merge upstream antirez/ds4 ${UPSTREAM:0:12} into 1bit/main"
          merged=$(git rev-parse HEAD)
          # the property tools/check_pins.py checks on the engine side, asserted before the push
          git merge-base --is-ancestor "$OURS" "$merged" || { echo "::error::the merge does not contain the old pin ${OURS:0:12}"; exit 1; }
          tag="ds4-main-${carried:0:12}"
          git rev-parse -q --verify "refs/tags/$tag" > /dev/null || git tag "$tag" "$carried"
          git push -q origin "refs/tags/$tag"
          git push -q origin "refs/heads/1bit/main"
          {
            echo "merged=$merged"
            echo "patches<<EOF"; git log --no-merges --format='- `%h` %s' "$UPSTREAM..$merged"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          OURS: ${{ steps.pins.outputs.ours }}
          OURS_BASE: ${{ steps.pins.outputs.ours_base }}
          MERGED: ${{ steps.fork.outputs.merged }}
          PATCHES: ${{ steps.fork.outputs.patches }}
        run: |
          set -euo pipefail
          branch="bump-ds4/${UPSTREAM:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          log=$(gh api "repos/antirez/ds4/compare/${OURS_BASE}...${UPSTREAM}" \
                  --jq '.commits[-30:][] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' || true)
          git config user.name "ds4-bump"
          git config user.email "ds4-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$MERGED,third_party/ds4"
          git commit -q -m "Bump DwarfStar: antirez/ds4 ${UPSTREAM:0:12}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump DwarfStar: antirez/ds4 ${UPSTREAM:0:12}" \
            --body "Moves third_party/ds4 (1bit-MONSTER/ds4 1bit/main) from \`${OURS:0:12}\` to \`${MERGED:0:12}\`: upstream main \`${UPSTREAM:0:12}\` merged into 1bit/main, so the new pin contains the old one and the pin check passes without a \"pin rollback\" label.

          Upstream commits (last 30):
          ${log}

          Our commits still on 1bit/main (none left means upstream has them all):
          ${PATCHES:-none}

          CI here has no GPU. Before merging, on Strix Halo:
          \`DS4_TEST=1 scripts/build-ds4.sh ~/.cache/ds4-pin rocm\` (builds, then runs DwarfStar's model-free routed-MoE GPU test), then \`1bit serve --device ds4 -m <DeepSeek V4 Flash Q2 .gguf> --ctx-size 8192\` and the same with its \`.1bp\` (\`gguf-tools/gguf_to_1bp.py\`) answer the same chat request (docs/dwarfstar.md)."

      # This workflow failed on EVERY scheduled run from 2026-10-21 to 2026-10-30 and nobody
      # noticed: the DwarfStar pin silently froze. A failing scheduled job that tells no one is
      # the actual defect, so this step makes it speak (the same step bump-hrx has had since its
      # own five silent days).
      - name: Report a failed sync so it cannot break silently
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}   # least privilege: no PAT needed to speak in this repo
        run: |
          set -euo pipefail
          title="bump-ds4: the scheduled DwarfStar pin sync is failing"
          body="The bump-ds4 run $GITHUB_RUN_ID failed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Two things to look at, in this order:
          1. **A merge conflict** in 'Merge upstream into 1bit/main' names the conflicting files in the log (2026-10-21..30: \`Makefile\`, on \`ds4.o\`'s prerequisites - our \`ds4_onebp.inc\` against upstream's \`ds4_deepseek41_dspark.h\`; the resolution keeps both). Resolve it on \`1bit-MONSTER/ds4\` \`1bit/main\` by hand, then re-run this workflow.
          2. **A merge that builds but fails its own check**: since upstream's DeepSeek-V4-Flash CUDA work, \`ds4_deepseek41_cuda.cuh\` references \`ds4_gpu_attention_output_low_q8_rows_exact_tensor\` and \`ds4_gpu_matmul_q8_0_kslice_rows_tensor\`, which the HIP/ROCm layer does not implement, so \`DS4_TEST=1 scripts/build-ds4.sh\` fails linking \`tests/test_mxfp4_rocm\` (the shipped \`ds4\`/\`ds4-server\`/\`ds4-bench\` do build). That is a porting decision for the DwarfStar lane, not a release blocker: the engine keeps its current pin until it is made.

          Why this step exists: bump-ds4 failed on every scheduled run from 2026-10-21 to 2026-10-30 without anyone noticing."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
