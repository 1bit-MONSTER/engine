#
# Intent: run the daily HF new-model watcher (tools/census_watch.py, via
# scripts/census-watch.sh) and alert when a newly-published model carries an architecture
# class the registry (registry/architectures.json) does not map. That is the one thing
# that silently moves the mapped share the census reports — this workflow turns it into a
# red check plus a deduped alert issue.
#
# The same entry point backs the 04:30 systemd timer on the development box
# (scripts/1bit-census-watch.{service,timer}); CI here is the second, self-hosted-free
# alert path (ubuntu-latest, stdlib python only — the registry is generated data, so
# unlike 1bit-MONSTER's watcher there is no g++ probe to compile).
#
# NOTE: scheduled runs only fire on the default branch. workflow_dispatch is the manual
# trigger for feature branches.
#
# Deliberately no pull_request trigger. The live watch is red whenever any newest model's
# class is unmapped — that is the alert — and the census reports a mapped share below
# 100% by design, so a PR gate would be red on every pull request and mean nothing. The
# watcher's own contract is checked offline by ctest `census_watch` (tests/census_watch_test.py,
# run by ci.yml), which needs no network and no HF state; the live alert runs on schedule.
#
# Gated/no-config models do NOT fail the run — they are unverifiable without an HF token
# and expected; only genuinely uncovered classes alert.

name: Census watch

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC daily, ahead of the 05:17 census sweep
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: census-watch
  cancel-in-progress: false

jobs:
  watch:
    name: New HF model classes are covered
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The watcher's state file (the model ids already classified) lives outside the
      # checkout and is not carried between CI runs, so the newest models are re-checked
      # every run — harmless, and the issue side dedupes.
      - name: Run the new-model watcher
        id: watch
        run: |
          bash scripts/census-watch.sh --limit 120 2>&1 | tee /tmp/census-watch.log
          exit ${PIPESTATUS[0]}

      # Only alert on scheduled/manual runs — on PRs the red check itself is the signal.
      # Guard on the watch step specifically so a checkout/setup failure doesn't file a
      # misleading issue.
      - name: File an alert issue on uncovered classes
        if: failure() && steps.watch.conclusion == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "UNCOVERED|UNVERIFIABLE" /tmp/census-watch.log || true
          gh label create census-watch 2>/dev/null || true
          EXISTING=$(gh issue list --label census-watch --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "census-watch issue already open — skipping"
            exit 0
          fi
          {
            echo "## Census coverage breach"
            echo ""
            echo "The daily new-model watcher found HF models whose architecture class is not"
            echo "mapped by the engine registry (\`registry/architectures.json\`):"
            echo ""
            echo '```'
            grep -E "UNCOVERED|UNVERIFIABLE" /tmp/census-watch.log || true
            echo '```'
            echo ""
            echo "Fix: map the class in \`registry/architectures.json\` when a pinned backend's"
            echo "code really accepts the architecture, or record why it is not an alias in"
            echo "\`registry/significant.json\` + \`docs/arch-gaps.md\` (a class reviewed as"
            echo "SIGNIFICANT needs real engine support, not a mapping). Re-run"
            echo "\`python3 tools/census_watch.py\` to confirm, and \`python3 tools/census.py"
            echo "--report\` for the coverage the census would report."
            echo ""
            echo "Report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/census_issue.md
          gh issue create \
            --title "census: new HF model class uncovered by the registry" \
            --label census-watch \
            --body-file /tmp/census_issue.md
