#
# Issue agent (tools/issue_agent.py): a first pass on issues opened by people outside the project,
# with the same local model as PR-Agent (1bit serve on the Strix Halo box, 127.0.0.1:8090). It adds
# one label from a fixed list, asks for the bug-report fields when a bug skipped the form, looks up
# linked Hugging Face models in registry/architectures.json and points questions to Q&A. The model
# only classifies; every comment is a template, so no issue text can make it post anything else.
# Maintainers can run it on any issue from the Actions tab (dry run by default).
name: issue-agent

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      dry_run:
        description: Print the result instead of posting it
        type: boolean
        default: true

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: [self-hosted, pr-agent]
    concurrency:
      group: issue-agent
      cancel-in-progress: false
    timeout-minutes: 20
    # outside authors only: owners, members and collaborators (and the agents) file issues that need no triage
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.type != 'Bot' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # a real one-token completion: the server answers /v1/models before the model is loaded
          ready=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 60 http://127.0.0.1:8090/v1/chat/completions -H 'Content-Type: application/json' \
                 -d '{"model":"qwen3-coder","messages":[{"role":"user","content":"ok"}],"max_tokens":1}' > /dev/null; then
              ready=1; break
            fi
            sleep 10
          done
          [ "$ready" = 1 ] || { echo "::error::the local model (coder-llm on :8090) does not answer"; exit 1; }
          python3 tools/issue_agent.py "$ISSUE" $DRY_RUN
