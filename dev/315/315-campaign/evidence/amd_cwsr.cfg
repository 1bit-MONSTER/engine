# engine#315: /etc/default/grub.d/amd_cwsr.cfg - RECONSTRUCTED 2026-10-13
#
# WHY THIS FILE IS HERE. The original live drop-in was removed by the H1 control
# (~/wt/315-cwsr-control.sh:68) and its verbatim bytes were NOT preserved: the ledger recorded
# only a path (~/work/amd_cwsr.cfg.backup) and an md5 (a8b25738...), and that file is gone. The
# grub.cfg the cwsr=0 boot used was regenerated at 04:52, so it does not carry the entry either.
#
# This is therefore a RECONSTRUCTION FROM DOCUMENTED SEMANTICS, not a byte-exact copy:
#   - the drop-in existed solely to put amdgpu.cwsr_enable=0 on the kernel cmdline (the entire
#     purpose of the cwsr work; the control script's header and the campaign consoles all say so);
#   - the ttm.pages_limit / ttm.page_pool_size options below MUST be repeated because
#     GRUB_CMDLINE_LINUX_DEFAULT is REPLACED, not appended to, by a grub.d fragment - and those
#     two values are present in the main /etc/default/grub and in /proc/cmdline;
#   - no other option is known to have been set by it.
#
# If the byte-exact original is ever recovered, it supersedes this file. Nothing in issue#315
# depends on the missing bytes: every arm's cwsr state was read live from
# /sys/module/amdgpu/parameters/cwsr_enable, never inferred from this file.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash ttm.pages_limit=31457280 ttm.page_pool_size=31457280 amdgpu.cwsr_enable=0"
