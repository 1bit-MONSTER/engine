# Issue form: a model 1bit should run.
name: Model request
description: A model that does not load or run, or that should run on another device.
title: "Model: "
labels: ["model request"]
body:
  - type: markdown
    attributes:
      value: |
        Check the model registry first (https://1bit.gg/registry.html): it lists every architecture each
        backend runs and which ones have been checked.
  - type: input
    id: model
    attributes:
      label: Model
      description: Hugging Face link to the model (or to its GGUF).
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      description: general.architecture of the GGUF, or architectures from config.json, if you know it.
  - type: dropdown
    id: device
    attributes:
      label: Device you want it on
      multiple: true
      options: [npu, vulkan, hrx, rocm, zinc, ds4, mlx, onnx, any]
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The command and what it printed, if you tried it.
      render: text
  - type: textarea
    id: why
    attributes:
      label: Why this model
      description: What you would use it for; links to its licence help.
