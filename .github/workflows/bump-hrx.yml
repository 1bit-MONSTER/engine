#
# Keep third_party/llama.cpp and third_party/hrx-system on the pair AMD's
# integration repo (ROCm/ggml-staging-automation) builds and tests together
# (docs/hrx.md): AMD-Ecosystem/llama.cpp (ggml-hrx) and ROCm/hrx-system, unchanged.
# When AMD moves its pair, this opens a PR here moving both submodules.
# GitHub-hosted CI builds that PR without HRX; run tests/serve_e2e.sh on Strix
# Halo before merging it.
#
# The private trees -DONEBIT_GPU_PRIVATE builds (1bit-MONSTER/gpu-kernels) are not
# moved from here; that repository keeps its own pins.
#
# Uses the secret HRX_BUMP_TOKEN (Contents and Pull requests read/write on
# 1bit-MONSTER/engine): a PR opened with the default GITHUB_TOKEN would not
# start CI.
name: bump-hrx

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-hrx
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with AMD's tested pair
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          amd_llama=$(gh api repos/ROCm/ggml-staging-automation/contents/llama.cpp --jq .sha)
          amd_hrx=$(gh api repos/ROCm/ggml-staging-automation/contents/hrx-system --jq .sha)
          ours_llama=$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')
          ours_hrx=$(git ls-tree HEAD third_party/hrx-system | awk '{print $3}')
          echo "AMD:  llama.cpp $amd_llama  hrx-system $amd_hrx"
          echo "ours: llama.cpp $ours_llama  hrx-system $ours_hrx"
          {
            echo "amd_llama=$amd_llama"; echo "amd_hrx=$amd_hrx"
            echo "ours_llama=$ours_llama"; echo "ours_hrx=$ours_hrx"
            if [ "$amd_llama" = "$ours_llama" ] && [ "$amd_hrx" = "$ours_hrx" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          AMD_LLAMA: ${{ steps.pins.outputs.amd_llama }}
          AMD_HRX: ${{ steps.pins.outputs.amd_hrx }}
          OURS_LLAMA: ${{ steps.pins.outputs.ours_llama }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: |
          set -euo pipefail
          branch="bump-hrx/${AMD_LLAMA:0:12}-${AMD_HRX:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          git config user.name "hrx-bump"
          git config user.email "hrx-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$AMD_LLAMA,third_party/llama.cpp"
          git update-index --cacheinfo "160000,$AMD_HRX,third_party/hrx-system"
          git commit -q -m "Bump HRX: llama.cpp ${AMD_LLAMA:0:12}, hrx-system ${AMD_HRX:0:12} (AMD's tested pair)"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump HRX: llama.cpp ${AMD_LLAMA:0:12}, hrx-system ${AMD_HRX:0:12}" \
            --body "Moves both submodules to the pair ROCm/ggml-staging-automation now pins.

          | | from | to |
          |---|---|---|
          | third_party/llama.cpp (AMD-Ecosystem/llama.cpp) | \`${OURS_LLAMA:0:12}\` | \`${AMD_LLAMA:0:12}\` |
          | third_party/hrx-system (ROCm/hrx-system) | \`${OURS_HRX:0:12}\` | \`${AMD_HRX:0:12}\` |

          CI here builds without HRX. Before merging, on Strix Halo:
          \`cmake -B build -G Ninja -DONEBIT_HRX=ON && cmake --build build --target onebit && for d in vulkan hrx; do tests/serve_e2e.sh build/1bit <Qwen3-0.6B Q4_K_M .gguf> \$d; done\`"
