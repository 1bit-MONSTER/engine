#
# The daily HF census (docs/registry.md): rebuild registry/architectures.json from the
# pinned HRX llama.cpp fork, sweep every HF text-generation model, and open a
# PR with the new counts. The mapped and checked counts are reported separately;
# registry/checked.json only changes when tools/registry_check.py runs on Strix Halo.
#
# Uses the same HRX_BUMP_TOKEN as the bump workflows (a PR opened with GITHUB_TOKEN
# would not run CI).

name: census

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Check out the pinned sources the registry reads
        run: git submodule update --init --depth 1 third_party/llama.cpp

      - name: Rebuild the registry and sweep HF
        run: |
          set -euo pipefail
          python3 tools/registry_build.py
          python3 tools/registry_build.py --check-gaps
          python3 tools/census.py | tee census.txt
          # engine#2850: two of the snapshot's counters are a function of the TREE, not of the sweep --
          # declined_architectures (significant.json `watch: report` classes with no backends) and declined_models (the
          # same classes' counts in this run). 2026-11-17 shipped them as 23/465 while the tree computed 30/1008: a
          # carried counter, invisible because nothing compared them. This runs HERE and not in PR CI on purpose -- a
          # PR that reviews a class makes the committed counters stale by definition, so a PR gate would red-light the
          # one PR that is doing the right thing. The job that regenerates the file is where they can be checked and
          # fixed in the same run.
          python3 tools/ci/census_counters_check.py --check --root .

      - name: Open the census PR
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- registry; then echo "no change"; exit 0; fi
          day=$(date -u +%F)
          branch="census/$day"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          summary=$(cat census.txt)
          python3 tools/census.py --pr-body > body.md
          git config user.name "census"
          git config user.email "census@users.noreply.github.com"
          git switch -c "$branch"
          git add registry
          git commit -q -m "Census $day: $summary"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "Census $day" --body-file body.md
