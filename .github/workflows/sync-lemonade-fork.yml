#
# Keep our Lemonade fork current (docs/lemonade.md): 1bit-MONSTER/lemonade is
# upstream lemonade-sdk/lemonade plus the onebit backend that runs the engine.
# Daily, this merges upstream's latest release (not main; Lemonade releases most
# Fridays and our weekly release builds on it) into the fork:
#   - a clean merge that still registers onebit is pushed to the fork's main;
#   - a conflicting merge is left for a person: the release is pushed to a
#     sync/<tag> branch and a PR is opened IN THE FORK listing the conflicts.
# It then disables every workflow in the fork. Upstream's build, release,
# website and PPA workflows must not run from the fork, so the merge never mirrors
# upstream's workflow files at all: the fork's own .github is put back over the
# merge result. That also keeps the token out of the `workflow` scope.
#
# Uses the secret HRX_BUMP_TOKEN, which needs Contents, Pull requests and Actions
# read/write on 1bit-MONSTER/lemonade as well as on this repository. It does NOT need
# the Workflows permission (classic token: the `workflow` scope): the sync never
# creates or updates a workflow file, and the fork's workflows are all disabled anyway.
# Every sync from 2026-09-26 to 2026-10-05 failed because an earlier version of this job
# pushed upstream's workflow files, which GitHub refuses without that permission.
name: sync-lemonade-fork

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Prove the token's write access to the fork (branch push, PR open/close, workflow disable) and leave the fork unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-lemonade-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORK: 1bit-MONSTER/lemonade
      UPSTREAM: lemonade-sdk/lemonade
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - name: Self-test the token's write access to the fork
        if: ${{ inputs.selftest }}
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          branch="sync-selftest/${GITHUB_RUN_ID}"
          git clone -q --filter=blob:none --depth 1 "https://x-access-token:${TOKEN}@github.com/${FORK}.git" st
          cd st
          git push -q origin "HEAD:refs/heads/${branch}"
          echo "PASS contents: pushed ${branch}"
          git config user.name "lemonade-fork-sync"
          git config user.email "lemonade-fork-sync@users.noreply.github.com"
          git commit -q --allow-empty -m "sync self-test (empty commit, closed and deleted by the same run)"
          git push -q origin "HEAD:refs/heads/${branch}"
          url=$(gh pr create --repo "$FORK" --base main --head "$branch" --draft \
                  --title "sync self-test ${GITHUB_RUN_ID}" --body "Opened and closed by the self-test in 1bit-MONSTER/engine's sync-lemonade-fork workflow.")
          gh pr close "$url" --repo "$FORK" --delete-branch > /dev/null
          echo "PASS pull requests: opened and closed ${url}"
          git ls-remote --exit-code origin "refs/heads/${branch}" > /dev/null && { echo "::error::self-test branch was not deleted"; exit 1; }
          echo "PASS contents: deleted ${branch}"
          id=$(gh api "repos/${FORK}/actions/workflows" --jq '.workflows[0].id')
          # Disabling an already-disabled workflow is refused, so enable it and
          # disable it again: the same permission, and the fork ends as it started.
          gh api -X PUT "repos/${FORK}/actions/workflows/${id}/enable" > /dev/null
          gh api -X PUT "repos/${FORK}/actions/workflows/${id}/disable" > /dev/null
          echo "PASS actions: enabled and disabled workflow ${id}"
          echo "SELFTEST PASSED: the token can do everything the sync needs"

      - name: Merge upstream's latest release into the fork
        if: ${{ !inputs.selftest }}
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "https://x-access-token:${TOKEN}@github.com/${FORK}.git" fork
          cd fork
          git config user.name "lemonade-fork-sync"
          git config user.email "lemonade-fork-sync@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)   # latest, never a pre-release
          git fetch -q upstream "refs/tags/${tag}:refs/tags/${tag}"
          up=$(git rev-parse "${tag}^{commit}")
          if git merge-base --is-ancestor "$up" HEAD; then
            echo "fork already contains upstream ${tag} (${up:0:12})"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          # keep_fork_github: put the fork's own .github back over whatever the merge
          # produced. The fork disables every workflow it has (last step), so mirroring
          # upstream's workflow files buys nothing — and GitHub refuses a push that
          # creates or updates .github/workflows unless the token carries the `workflow`
          # scope, which is why every sync from 2026-09-26 failed.
          keep_fork_github() {
            git rm -rq --cached .github 2>/dev/null || true
            git checkout "$before" -- .github
            git clean -fdq -- .github 2>/dev/null || true
          }
          if git merge -q --no-commit --no-ff "$up"; then
            keep_fork_github
            git commit -q -m "Sync upstream ${UPSTREAM} ${tag} (${up:0:12})"
            # The fork exists for the onebit backend: never push a merge that lost it.
            grep -q '"onebit|onebit"' CMakeLists.txt || { echo "::error::onebit is no longer registered after the merge"; exit 1; }
            test -f src/cpp/server/backends/onebit/onebit_server.cpp || { echo "::error::onebit_server.cpp is gone after the merge"; exit 1; }
            git push -q origin HEAD:main
            echo "merged upstream ${tag} (${up:0:12}) into ${FORK} main"
          else
            conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git merge --abort
            branch="sync/${tag}"
            if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
              echo "$branch already exists"; exit 0
            fi
            # Same reason as above: hand the release over on a branch that carries the
            # fork's .github, so the push needs contents write only.
            git checkout -q -b "$branch" "$up"
            keep_fork_github
            git commit -q -m "Sync upstream ${UPSTREAM} ${tag} (conflicts; the fork's .github is kept)"
            git push -q origin "${branch}:refs/heads/${branch}"
            gh pr create --repo "$FORK" --base main --head "$branch" \
              --title "Sync upstream ${UPSTREAM} ${tag} (conflicts)" \
              --body "Upstream release ${tag} (\`${up:0:12}\`) does not merge cleanly into the fork. Conflicting files:

          ${conflicts}

          Resolve so that the onebit backend stays registered, then merge."
          fi

      - name: Keep the fork's workflows disabled
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          for id in $(gh api "repos/${FORK}/actions/workflows" --paginate --jq '.workflows[] | select(.state=="active") | .id'); do
            gh api -X PUT "repos/${FORK}/actions/workflows/${id}/disable" > /dev/null
            echo "disabled workflow ${id}"
          done
