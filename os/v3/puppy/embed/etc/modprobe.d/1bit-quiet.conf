# 1bit OS: keep the boot quiet. Measured on the cycle-14 board boot (2026-11-02 ~21:00), the only two lines in
# dmesg that are not the machine working are a pcspkr double registration and an HDMI infoframe error.
#
# snd_pcsp and pcspkr both drive the same PC speaker (both are in the zdrv), and the second one to bind logs the
# duplicate. The appliance does not need the ALSA one: blacklisting it leaves pcspkr - the beeper a console error
# uses - and stops the duplicate. Nothing else is silenced here: the HDMI infoframe line comes from amdgpu on an
# unconnected output and carries no fault, so it is left alone rather than papered over.
blacklist snd_pcsp
