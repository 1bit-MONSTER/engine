# systemd drop-in for the Lemonade PPA's lemond (docs/lemonade.md, "Ubuntu 26.04: the PPA's lemond"):
# /etc/systemd/system/lemond.service.d/1bit-hrx.conf. Lemonade's HRX recipe (llamacpp-hrx) then
# starts the engine's llama-server, through lemonade-hrx, instead of downloading its own HRX build;
# lemond reads LEMONADE_HRX_HRX_BIN before hrx.hrx_bin in config.json. scripts/install-lemonade-ppa.sh
# installs it with /opt/1bit replaced by the engine's directory.
[Service]
Environment=LEMONADE_HRX_HRX_BIN=/opt/1bit/lemonade-hrx
# /dev/kfd and /dev/dri/renderD*: the PPA's postinst puts the lemonade user in the render group
