#
# The daily model-pin watch (docs/model-pins.md): compare every pin in models/pins.json with the
# upstream repo's current main, re-read the chat template of anything that moved, and open ONE PR per
# changed repo bumping that repo's pin, with the report as the body. Adoption is a reviewed merge; this
# workflow never touches the catalogue, the stick image or a scoreboard row.
#
# Uses the same HRX_BUMP_TOKEN as the bump and census workflows: a PR opened with GITHUB_TOKEN would not
# run CI. That token also lifts Hugging Face's anonymous rate limit where the range reads need it.

name: pin-watch

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-watch
  cancel-in-progress: false

jobs:
  pin-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare every pin with its upstream
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -uo pipefail
          # exit 1 means "a pin moved", which is the normal case this workflow exists for
          rc=0
          python3 tools/pin_watch.py --check --out pin-report.md || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          echo "moved=$(grep -c '^## `' pin-report.md || true)" >> "$GITHUB_OUTPUT"
          cat pin-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open one pin bump per changed repo
        if: steps.check.outputs.moved != '0'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          git config user.name "pin-watch"
          git config user.email "pin-watch@users.noreply.github.com"
          grep '^## `' pin-report.md | sed 's/^## `//; s/`$//' | while read -r repo; do
            slug=$(echo "$repo" | tr '/.' '--')
            branch="pin-watch/$slug-$day"
            if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
              echo "$branch already exists"; continue
            fi
            git switch -c "$branch" main --quiet
            if ! python3 tools/pin_watch.py --bump "$repo"; then
              # a tracked file vanished upstream: the report says so, and a human decides
              echo "::warning::$repo could not be bumped automatically (see the report)"
              git switch main --quiet
              continue
            fi
            python3 tools/pin_watch.py --pr-body "$repo" > body.md || true
            newsha=$(python3 -c 'import json,sys; print(json.load(open("models/pins.json"))["pins"][sys.argv[1]]["commit"][:8])' "$repo")
            git add models/pins.json
            git commit -q -m "pin: $repo at $newsha""
            git push -q origin "$branch"
            gh pr create --base main --head "$branch" --title "Pin: $repo" --body-file body.md
            git switch main --quiet
          done
