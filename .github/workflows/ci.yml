name: ci
on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: the "pin rollback" label turns the pin check off
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copyright notice on every file
        run: python3 tools/copyright.py --check
      - name: Submodule pins only move forward
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'pin rollback')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          python3 tools/check_pins.py "$BASE"
      - name: GGUF -> Q4NX repack
        run: |
          python3 -m pip install --user numpy gguf
          python3 tests/gguf_to_q4nx_test.py
      - name: Install build dependencies
        # GCC 15, as on the Strix Halo development machine: the engine is C++26, which the
        # runner's own GCC 13 cannot build
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update && sudo apt-get install -y g++-15 ninja-build libcurl4-openssl-dev libzstd-dev libssl-dev libdrm-dev libpcre2-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
      - name: Build
        run: cmake --build build --target onebit npu_full_elf_test npu_pack_test npu_q4nx_test npu_private_route_test tokenizer_test think_split_test gguf_meta_test -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
