# systemd drop-in for a self-hosted runner unit that predates scripts/install-ci-runner.sh (engine#1504). Installed as
# /etc/systemd/system/<unit>.d/restart.conf by the owner; docs/ci-runners.md "The two drop-ins" has the commands.
# It gives the unit the crash-recovery lines of the documented unit and changes nothing else (same user, same paths).
[Unit]
# never give up restarting: a runner that hit the start limit is as dead as one that was never restarted
StartLimitIntervalSec=0

[Service]
# always, not on-failure: runsvc.sh exits 0 when it is killed, so on-failure never fires
Restart=always
RestartSec=15
# the kernel's OOM victim is one process; with the default (stop) that ends the unit. continue lets the job die and
# the runner keep running, so the job fails with a reason instead of the runner vanishing
OOMPolicy=continue
