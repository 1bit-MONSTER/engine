#
# Cycle 26, item 1: the console belongs to the console. Nothing may print onto tty1 while the console TUI is on it.
#
# Measured on the c25 take: the boot line carries no `loglevel=`, so console_loglevel was 7 (the kernel default) and
# every kernel message went to tty0 - which is the active VT - which is the screen. At 08:52:09Z the NPU TDR printed
# 15 err + 5 warn lines there (`aie2_legacy_tdr_detect`, then ~18 `*ERROR* aie2_set_cmd_timeout:` firmware-report
# lines), straight over the TUI the owner was recording.
#
# The mechanism, measured in the guest rather than assumed: this rootfs is an Ubuntu base, and Ubuntu ships
# /usr/lib/sysctl.d/55-console-messages.conf with `kernel.printk = 4 4 1 7`. Puppy's /etc/rc.d/rc.sysinit calls
# `sysctl --system`, so that value is applied late in boot - after `1bit-console` had already run `dmesg -n 1`
# (measured: level 7 at t=44 s, level 4 from t=50 s, and it stays 4). Level 4 still prints KERN_ERR - the TDR lines
# are KERN_ERR - so the console kept being painted.
#
# Verified in the guest: with this file present, `sysctl --system` ends at `1 4 1 7` (the /etc slot is applied last);
# without it, `4 4 1 7`. Level 1 keeps KERN_EMERG and KERN_ALERT - a panic is still on the screen where a person can
# see it - and nothing else. This does not lose evidence: the ring is 32 MB (log_buf_len=32M) and /data/logs copies
# it, so `dmesg`, `1bit-proof` and the boot proof keep every line that is no longer printed.
#
# `1bit-console` also runs `dmesg -n 1` when it takes the screen; that covers the other order (console starting after
# rc.sysinit) and re-asserts the level after any late script that writes it. The vm-check row `U2 console quiet`
# asserts the result on a booted artifact, so a future base image that moves this cannot pass silently.
kernel.printk = 1 4 1 7
