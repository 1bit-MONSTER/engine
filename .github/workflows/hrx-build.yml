#
# The HRX build at PR time (engine#1077, docs/hw-gate.md "The HRX build check"). ci.yml configures
# the engine without ONEBIT_HRX, so it never enters cmake/hrx.cmake, and hw-gate.yml runs only on a
# labelled PR or a bump-hrx/* branch: before this job, ggml/src/ggml-hrx in the pinned
# third_party/llama.cpp was compiled by no job at PR time, pin bumps included.
#
# What it runs: the engine configured with -DONEBIT_HRX=ON and `cmake --build --target onebit`,
# which builds llama_hrx (llama.cpp with GGML_HRX=ON, and hrx-system from the pinned tree, through
# cmake/hrx.cmake) and then links onebit with its HRX wiring. A compile and a link only: no device,
# no GPU token, no NPU lock. The public plumbing only: the private HIP add-on is the hardware
# gate's job (hw-gate.yml), so this log never shows private source.
#
# Cost: $0 Actions spend. It is a self-hosted job on the box's engine runner, never a hosted one.
# The build tree persists under ~/.cache/hrx-build/bench on the box and llama_hrx is BUILD_ALWAYS, so a
# PR rebuilds what it changed; a pin bump pays the full build once. It runs on the build's own
# inputs only (the paths below), not on every PR.
#
# Runner: [self-hosted, strixhalo, bench], the box's bench runner, not the pr-agent one: a cold build
# holds its runner for a while, and on the pr-agent runner it queued every PR-Agent review behind it
# (engine#1077; owner 2026-11-06: move it to bench). Same box, so TheRock at /opt/rocm-therock
# (cmake/hrx.cmake's default without a fetched SDK). The runner runs one job at a time, and the tree
# is its own (~/.cache/hrx-build/bench), so no two runs share a tree.
# The build runs under ~/lb/thermal-run.sh (4 cores, paused at 78 C) like every build on the box.
# A PR whose only trigger change is test registration in CMakeLists.txt (add_test/set_tests_properties lines,
# comments, blanks) configures with ONEBIT_HRX=ON and skips the compile: such a line creates no target and sets
# no flag, but it is still evaluated at configure time, including inside if(ONEBIT_HRX) blocks ci.yml never
# configures. tools/ci/hrx_build_scope.py decides; anything it does not recognise builds.
# Memory (engine#1504): the box is shared and its GTT is host RAM, and on 2026-11-08 both runners were OOM-killed,
# the second time 76 s after a restart that handed this job a compile. So the compile waits for MemAvailable to
# reach a floor (scripts/mem-wait.sh, up to 15 min, then the job fails and says why), and it runs under
# scripts/mem-guard.sh --term, which ends the whole thermal-run scope before the kernel's OOM killer picks
# someone else's process.
# Fork PRs never reach the box: the `if:` requires the head repository to be this one.
name: hrx-build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - third_party/llama.cpp
      - third_party/hrx-system
      - CMakeLists.txt
      - cmake/tests-*.cmake
      - cmake/hrx.cmake
      - config/hrx-toolchain.config
      - config/hrx-system-hold.config
      - app/serve.cpp
      - .github/workflows/hrx-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hrx_build:
    runs-on: [self-hosted, strixhalo, bench]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: hrx-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # a cold build (both pins moved) on 4 throttled cores; an incremental one takes minutes
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          # the PR's merge commit and its first parent (the base), for the scope step
          fetch-depth: 2

      - name: Scope (compile, or configure only)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          verdict=full
          if [ "$EVENT" = pull_request ]; then
            # prints full or configure-only (exit 0 for configure-only, 10 for full); a crash prints neither
            verdict=$(python3 tools/ci/hrx_build_scope.py --base HEAD^1 --head HEAD) || true
          fi
          if [ "$verdict" = configure-only ]; then echo "build=false"; else echo "build=true"; fi >> "$GITHUB_OUTPUT"

      - name: Check out the HRX pair (llama.cpp + hrx-system)
        run: |
          set -euo pipefail
          git submodule sync -- third_party/llama.cpp third_party/hrx-system
          git -c protocol.version=2 submodule update --init --depth 1 third_party/llama.cpp third_party/hrx-system
          git submodule status -- third_party/llama.cpp third_party/hrx-system
          # outside the checkout, which actions/checkout cleans: the tree persists across runs
          echo "HRX_BUILD=$HOME/.cache/hrx-build/bench" >> "$GITHUB_ENV"

      - name: Install the python the fork's -py test rows import
        run: |
          set -euo pipefail
          # `test-jinja-py` is bin/test-jinja -py: the C++ test shells out to /usr/bin/python3 and
          # imports jinja2 + numpy. A runner without them fails that row with ModuleNotFoundError and
          # the ratchet files it as a NEW failure (run 45867026620), which is a runner gap, not a code
          # regression. dpkg keeps this idempotent on the persistent tree.
          if ! dpkg -s python3-jinja2 python3-numpy >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-jinja2 python3-numpy
          fi
          python3 -c 'import jinja2, numpy; print("jinja2", jinja2.__version__, "numpy", numpy.__version__)'

      - name: Configure with ONEBIT_HRX=ON
        env:
          # the same sha the stamp step records, so the binary's `--version` and the tree's stamp cannot disagree
          ONEBIT_BUILD_ENGINE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ~/lb/thermal-run.sh cmake -S . -B "$HRX_BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DONEBIT_HRX=ON -DONEBIT_HRX_BUILD_TESTS=ON

      - name: Configure only (test registration, no compile)
        if: steps.scope.outputs.build != 'true'
        run: echo "only test registration changed in CMakeLists.txt; the ONEBIT_HRX=ON configure above passed, the compile is skipped" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for memory (or refuse)
        if: steps.scope.outputs.build == 'true'
        timeout-minutes: 20
        # 24 GB free before a 4-core compile starts; it is stopped if the box drops under 12 GB (hw-gate's floor)
        run: scripts/mem-wait.sh 24 15

      - name: Build llama_hrx and onebit
        if: steps.scope.outputs.build == 'true'
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # the guard outside thermal-run: SIGTERM makes thermal-run end its whole scope (ninja and the compilers)
          scripts/mem-guard.sh --term 12 ~/lb/thermal-run.sh cmake --build "$HRX_BUILD" --target onebit -j 4
          # the build must have produced the HRX backend and the server onebit runs
          ls -l "$HRX_BUILD"/hrx/llama/bin/llama-server
          find "$HRX_BUILD"/hrx/llama -name 'libggml-hrx.so*' -print -quit | grep .

      - name: Stamp the tree with its build provenance
        if: steps.scope.outputs.build == 'true'
        env:
          ENGINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # --engine, not the checkout's HEAD: actions/checkout gives a PR run a SYNTHETIC merge commit, so deriving
          # it in here stamped 241017c32dbb on 11-20 -- a sha no lane's `git rev-parse HEAD` can equal, which makes
          # every `check --expect-engine` answer "the field moved" on a tree that is exactly the pin. The head sha of
          # the commit being built is the one a lane can name.
          python3 tools/ci/bench_stamp.py write --tree "$HRX_BUILD" --root "$PWD" \
              --engine "${ENGINE_SHA:0:12}" | tee -a "$GITHUB_STEP_SUMMARY"
          # the same file a lane reads before quoting a number from this tree
          cat "$HRX_BUILD/bench-stamp.txt" >> "$GITHUB_STEP_SUMMARY"
          # and the copy that travels with the binary: this job has both submodules checked out, so it is the one
          # place that proves the submodule branch of the stamp -- a lane tree without them prints `unknown`
          "$HRX_BUILD/1bit" --version | tee -a "$GITHUB_STEP_SUMMARY"
          # The two artefacts this job produced must agree, and the check is not the stamp comparing itself: the
          # binary carries its own header, so grep THAT. The lowering is read from the code objects just built, so
          # after a real build `check` can answer 0 -- the state a tree whose code objects exist deserves.
          python3 tools/ci/bench_stamp.py check --tree "$HRX_BUILD" --expect-engine "${ENGINE_SHA:0:12}" || \
              [ $? -eq 2 ] || { echo "::error::the tree stamp does not match this build"; exit 1; }
          "$HRX_BUILD/1bit" --version | grep -q "engine ${ENGINE_SHA:0:12}" || {
              echo "::error::1bit --version does not name this build's head sha"; exit 1; }
      - name: Run the fork's own ctest rows
        if: steps.scope.outputs.build == 'true'
        # engine#2836: 37 `test-hrx-*` rows are registered in the fork's tests/CMakeLists.txt inside
        # `if (TARGET ggml-hrx)`, and until now nothing built or ran one of them -- the ExternalProject builds
        # three binaries by name. ONEBIT_HRX_BUILD_TESTS=ON above is what registers them; this builds the
        # binaries and runs the row that already exists for them (`fork_ctest_known_fail`, CMakeLists.txt:305),
        # which skips (77) in ci.yml because there is no HRX tree there and applies the known-failure ratchet
        # here because there is.
        #
        # Measured on ryzen 2026-11-17 (gfx1201, GTT 22.6 GiB): 20 of 37 pass. The rest are named in
        # tools/ci/ctest_known_fail.txt -- 11 of them are one class, `ggml_backend_supports_op` returning false
        # for a row op the backend has no kernel for, which is engine#2774/#2832. Two rows cannot be evaluated
        # yet: test-hrx-host-resident does not compile (its target compiles ggml-hrx/host-weight-placement.cpp
        # without `ggml/src` on the include path, so `ggml-backend-impl.h` is not found) and is baselined as
        # `Not Run`; test-hrx-ops/-loom (271 cases, 694 s) stay excluded by the script's -E.
        timeout-minutes: 40
        run: |
          set -euo pipefail
          fork="$HRX_BUILD/hrx/llama"
          # -k 0, because one row does NOT build at this pin (test-hrx-host-resident compiles a ggml-hrx source
          # without ggml/src on its include path) and an aborted build would take the other 33 binaries with it.
          # The failure is not swallowed: ctest reports that row as `Not Run` and the baseline names it, so the
          # ratchet answers, and a row that stops building while the baseline says it runs is a new failure.
          scripts/mem-guard.sh --term 12 ~/lb/thermal-run.sh cmake --build "$fork" -j 4 -- -k 0 \
            || echo "one or more fork test targets did not build; ctest reports them as Not Run"
          # A ctest row inherits no environment from the engine, and HRX dlopens the HSA runtime itself: the
          # distro's libhsa-runtime64 has no `hsa_amd_queue_create`, so every device row reports
          # "test skipped: no device available" and — because the fork registers that as a failing regex — a
          # FAIL, not a skip. Pass the runtime this configure resolved (cmake/hrx.cmake:137, engine#1766).
          export IREE_HAL_AMDGPU_LIBHSA_PATH="$(sed -n 's/^ONEBIT_HRX_LIBHSA:FILEPATH=//p' "$HRX_BUILD/CMakeCache.txt")"
          echo "fork tests: HSA runtime $IREE_HAL_AMDGPU_LIBHSA_PATH"
          # engine#3000: THE ROW IS OPT-IN AND THIS JOB NEVER OPTED IN. `fork_ctest_known_fail` is registered
          # with SKIP_RETURN_CODE 77 and skips unless ONEBIT_FORK_CTEST=1 (it is opt-in because on a lane box
          # without a fork tree it must not run), so the step above built 33 test binaries and then ran none of
          # them: measured in run 44737964422, `1/1 Test #21 ... ***Skipped`, `100% tests passed` -- a green tick
          # over a suite nothing executed, one layer up from engine#2761's complaint. This job IS the place the
          # opt-in was written for, so it opts in.
          #
          # Cost, measured on the bench tree rather than argued: the ratchet excludes hrx-ops-test/test-hrx-ops/
          # test-hrx-ops-loom (-E in fork_ctest_known_fail.sh), leaving 113 of 116 rows whose recorded cost sums
          # to 184 s -> ~46 s wall at the script's -j 4, about 2 % of a 40-minute job.
          # NOT ONEBIT_FORK_CTEST_NO_DEVICE=skip: that makes the row exit 77, ctest calls it Skipped, and the guard
          # below -- correctly -- treats a skip in this job as an error. The device-requiring row it was aimed at
          # (test-testing-suite-skip) is excluded by name in fork_ctest_known_fail.sh instead, which keeps the
          # ratchet's real verdict (113 rows, 0 new) rather than trading it for a 77.
          row=$(ONEBIT_FORK_CTEST=1 ctest --test-dir "$HRX_BUILD" -R '^fork_ctest_known_fail$' --output-on-failure 2>&1) \
            || { printf '%s\n' "$row"; exit 1; }
          printf '%s\n' "$row"
          # ... and a SKIP here is a failure too, because this is the one job whose purpose is to run that row:
          # the tree exists (the build above made it), so there is no legitimate reason to skip -- and ctest
          # counts a skip as "not failed" ("100% tests passed" with `1/1 ... ***Skipped` is exactly how the suite
          # ran zero rows for two days, engine#3000).
          case "$row" in
            *"fork_ctest_known_fail"*"***Skipped"*)
              echo "::error::fork_ctest_known_fail SKIPPED in the one job that has an HRX tree -- the ratchet did not run (engine#3000)"
              exit 1 ;;
          esac
          # ... and PRINT WHAT IT READ. ctest shows a test's output only on failure, so a passing run said just
          # "Passed" -- the evidence would disappear exactly when the row goes green, which is the complaint this
          # change exists for. The ratchet's own summary is in the log ctest kept for that test.
          # `grep ... | tail -3 || echo` does NOT fall back: `||` tests the pipeline's status, which is `tail`'s, and
          # tail succeeds on empty input -- so the note was unreachable in the one case it was written for
          # (measured: `grep … | tail -3 || echo NOTE` prints nothing on an empty file, while the same grep with
          # its output redirected returns 1). Test grep's own status instead.
          log="$HRX_BUILD/Testing/Temporary/LastTest.log"
          if grep -q "ctest_known_fail:" "$log" 2>/dev/null; then
            grep -h "ctest_known_fail:" "$log" | tail -3
          else
            echo "note: no ctest_known_fail summary in $log -- the row passed without saying what it read"
          fi
      # engine#2858: a tree that cannot say where it came from is not a measurement. On 11-18 this tree
      # reported IQ1_S prefill at 11.22 tok/s where four local builds of the same source on the same box gave
      # 56.5-56.6, with identical placement, PPL and kernel names -- and nothing recorded which lowering had
      # emitted its code objects, so the number could not be told apart from a real one. The stamp names the
      # three checkouts and the lowering (as `unknown` when the build did not record it, which is itself the
      # finding), and tools/ci/bench_stamp.py check refuses to call a tree comparable unless it matches.
