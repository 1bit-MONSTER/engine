  1bit OS - the chat screen the appliance's desktop opens.

  Why this page exists when Lemonade already ships a web UI. Measured on 2026-11-02, in the browser this image
  ships (Pale Moon 33.0.1, Goanna 6.6): Lemonade's own UI RENDERS (chat page, model picker, composer - screenshots
  in ~/briefs/demo-shots), but a prompt sent from it produced no request at the server, and a capability probe run
  in that same browser names the gap - MISSING: TextDecoderStream, AbortSignal.timeout, CSS backdrop-filter, CSS
  :has(). All three of the first are what a streaming chat client normally uses. The same browser streams happily
  from fetch + response.body.getReader + TextDecoder, which is all this page uses: measured "198 SSE chunks, 0.9 s,
  972 chars" against the release engine, twice. So the appliance's own demo surface avoids the missing APIs instead
  of betting the demo on a browser feature the image does not have, and the real UI stays one click away in the
  header. (The black rectangle that shows up in the xwd captures sits in the same place on every page in this
  browser - it is a capture artifact of Xvfb + xwd, not something the pages paint.)

  Opened as http://localhost:8080/ by /usr/local/bin/1bit-lemonade-webapp (the desktop autostart), served by
  /etc/init.d/24onboard-webapp. There is NO key in that URL and none in this page: the server on 8080 is
  1bit-webapp-proxy, which adds `Authorization: Bearer <key from /etc/1bit/lemond.conf>` to every /api/ request it
  forwards to Lemonade (cycle 17 item 8 - the cycle-16 demo recording had `?key=…` in the address bar). The page is
  same-origin only: the old `?api=` override (a debug affordance nothing used) is gone, so no request URL carries a
  user-supplied value. A ?key= left over from an older launcher is used once and then dropped from the address bar,
  so it cannot end up in a recording or in history.

  Cycle 18 (from the c17 board demo) fixed two things about the conversation itself, both visible in the owner's
  recording: a thinking model (Qwen3) put its whole reply in `reasoning_content`, so the page - which read only
  `delta.content` - showed a mid-sentence stop and then "done: 0 chunks", and the model could only be chosen with
  ?model= in the URL. So the page now asks for `enable_thinking: false` by default (Lemonade's own extension;
  "show thinking" sends true and renders the reasoning dimmed above the answer), gives the answer 1024 tokens
  instead of 512, and has a dropdown built from /api/v1/models that names each model's backend (GPU / NPU). A
  stream that ends without [DONE], or one that produced reasoning and no answer, now says so in its own words
  instead of reporting zero chunks.
-->
<meta charset="utf-8">
<title>1bit OS - chat</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101214; color: #e8eaed; font: 17px/1.5 system-ui, "DejaVu Sans", sans-serif; }
  header { padding: 14px 20px; background: #17191c; border-bottom: 1px solid #2a2d31; display: flex; gap: 16px;
           align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 20px; letter-spacing: .3px; }
  header span { color: #9aa3ad; font-size: 14px; }
  #wrap { padding: 18px 20px 120px; }
  #out { font-size: 18px; }
  #out .u { color: #7fd1ff; }
  /* the model's thinking, when it shows any: dimmed, so an answer never looks like it starts mid-sentence */
  #out .think { color: #8b949e; font-style: italic; white-space: pre-wrap; }
  #out .ans { white-space: pre-wrap; }
  #out .turn { margin: 0 0 14px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px; background: #17191c;
         border-top: 1px solid #2a2d31; display: flex; gap: 12px; align-items: center; }
  #model { font-size: 16px; padding: 12px 10px; border-radius: 10px; border: 1px solid #3a3f45;
           background: #0d0f11; color: #e8eaed; max-width: 30%; }
  #thinkl { color: #9aa3ad; font-size: 14px; white-space: nowrap; }
  input[type=text] { flex: 1; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid #3a3f45;
                     background: #0d0f11; color: #e8eaed; }
  button { font-size: 17px; padding: 12px 20px; border-radius: 10px; border: 1px solid #3a6ea5; background: #1d4f7c;
           color: #eaf3ff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #stat { color: #9aa3ad; font-size: 14px; padding: 6px 20px 0; }
  a { color: #7fd1ff; }
</style>
<header>
  <b>1bit OS</b><span id="who">chat</span><span id="srv"></span>
  <span style="margin-left:auto"><a id="uibtn" href="#">Lemonade's own web UI</a></span>
</header>
<div id="wrap"><div id="out"></div></div>
<div id="stat">ready</div>
<div id="bar">
  <select id="model" title="the model this page talks to, from /api/v1/models"></select>
  <input id="q" type="text" autofocus placeholder="Ask the appliance something and press Enter…">
  <button id="go">Send</button>
  <label id="thinkl" title="off: the model answers directly (enable_thinking:false). on: it reasons first, shown dimmed above the answer."><input
    type="checkbox" id="think"> show thinking</label>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  // Same origin, always: the server that served this page IS the proxy that holds the key, so the paths below are
  // literal and there is no user-controlled value in a request URL (CodeQL's client-side request forgery on the
  // cycle-18 diff; the old ?api= override was a debug affordance nothing in the image used and a way to make the
  // appliance's own browser POST at another host).
  var api = "";
  var q = document.getElementById("q"), out = document.getElementById("out"), stat = document.getElementById("stat");
  var go = document.getElementById("go"), ui = document.getElementById("uibtn");
  var sel = document.getElementById("model"), think = document.getElementById("think");
  // an old ?key= link keeps working, but the secret is taken out of the address bar immediately (no history entry
  // to read it from, nothing for a screen recording to catch). New launchers do not use it at all.
  var key = p.get("key") || "";
  if (p.get("key")) {
    try { history.replaceState({}, "", location.pathname); } catch (e) {}
  }
  ui.href = "http://127.0.0.1:13305/";
  ui.title = "Lemonade's own web UI asks for the API key (console menu item 1 shows it)";
  document.getElementById("srv").textContent = api || (location.origin + " (Lemonade key held here)");
  var host = location.hostname || "this machine";
  var busy = false;
  // Cycle 18, item 1: a thinking model (Qwen3) spends its budget inside reasoning_content, so `content` arrives
  // empty and a 512-token reply reads "done: 0 chunks" - measured on the c17 board demo, where the visible answer
  // was cut mid-sentence and the follow-up printed "done: 0 chunks in 5.9 s". So: ask for no reasoning by default
  // (Lemonade's own extension, bin/resources/docs/api/openai.md: `enable_thinking: false`), keep a switch for it,
  // and give the answer a budget that the reasoning cannot swallow whole.
  var MAXTOK = 1024;
  var want = p.get("model") || "";       // ?model= still pins one; the dropdown is the normal way now
  var model = "";                        // the id this page is chatting with
  think.checked = p.get("think") === "1";
  var have = [];                         // the models on this machine, as /api/v1/models lists them

  function headers() {
    var h = { "Content-Type": "application/json" };
    if (key) h["Authorization"] = "Bearer " + key;
    return h;
  }
  function backend(m) {
    var o = (m && m.recipe_options) || {};
    if (o.onebit_backend === "npu" || /-NPU-1bit$/i.test(m.id || "")) return "NPU";
    if (m.recipe === "onebit") return "GPU";
    return m.recipe || "";
  }
  function label(m) {
    var b = backend(m);
    return m.id + (b ? "  ·  " + b : "");
  }
  function show() {
    var m = null, i;
    for (i = 0; i < have.length; i++) { if (have[i].id === model) m = have[i]; }
    document.getElementById("who").textContent = "chat on " + host + (model ? " / " + (m ? label(m) : model) : "");
  }
  // The picker is the fix for "no model picker on the chat page: only ?model= in the URL" (cycle 18, item 2).
  // Only what is ON the machine: a catalogue entry that is not downloaded turns a demo into a 1-4 GB download
  // (measured on 2026-11-02: the first onebit id in the list was an undownloaded catalogue entry and the page sat
  // on "waiting for the first token"). GPU/NPU comes from the model's own recipe_options, and an NPU set is what
  // the board's dx route serves, so the two are distinguishable before a prompt is typed.
  function fill() {
    return fetch(api + "/api/v1/models?show_all=true", { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var all = (j && j.data) || [];
        have = all.filter(function (m) { return m.downloaded !== false; });
        // a 1bit model first: this page is the appliance's chat, and the appliance's models are ours
        have.sort(function (a, b) { return (/1bit/i.test(b.id) ? 1 : 0) - (/1bit/i.test(a.id) ? 1 : 0); });
        while (sel.options.length) { sel.remove(0); }
        if (!have.length) {
          var o = document.createElement("option");
          o.textContent = "no model on this machine - console menu item 4, Models";
          o.disabled = true; sel.appendChild(o); sel.disabled = true;
          throw new Error("the server lists no downloaded model - pull one from the console menu (item 4)");
        }
        have.forEach(function (m) {
          var o = document.createElement("option");
          o.value = m.id; o.textContent = label(m);
          sel.appendChild(o);
        });
        sel.disabled = false;
        // a pick already made survives a refill - ask() refills before every prompt, and resetting the model
        // there silently threw the dropdown's choice away (measured in the cycle-18 browser probe: the header
        // said qwen3-0.6b-q4_k_m-1bit and the request carried the NPU model)
        if (want && have.some(function (m) { return m.id === want; })) model = want;
        else if (!model || !have.some(function (m) { return m.id === model; })) model = have[0].id;
        sel.value = model;
        show();
        return model;
      });
  }
  sel.addEventListener("change", function () { model = sel.value; show(); q.focus(); });

  // engine#924: a request that cannot have the NPU (the device is one cache, one generation at a time) is
  // REFUSED with a status, never parked silently: 503 + Retry-After + {"error":{"type":"device_busy"}} when the
  // engine refuses before it starts answering, and - for a streaming request, which is what this page sends - one
  // `data: {"error":...}` frame followed by `data: [DONE]`, because a stream that ends without [DONE] is what
  // Lemonade reports as a hung backend (the c17 board's "0 chunks in 5.9 s"). Both shapes mean the same thing and
  // both are retried here, up to RETRIES times, saying so on the status line while it waits.
  var RETRIES = 3;
  function isBusy(json) {
    var e = (json && json.error) || json || {};
    return e.type === "device_busy" || (json && json.type === "device_busy");
  }
  function waitMs(res) {
    var s = 1;
    try { s = parseInt(res.headers.get("Retry-After"), 10); } catch (e) {}
    if (!(s >= 0)) s = 1;
    return Math.min(s, 10) * 1000;   // never park the demo for longer than the engine asks for
  }
  var busyErr = function (ms, why) {
    var e = new Error("device_busy"); e.busy = true; e.waitMs = ms; e.why = why || "device_busy"; return e;
  };

  function ask() {
    var text = (q.value || "").trim();
    if (!text || busy) return;
    busy = true; go.disabled = true; sel.disabled = true; q.value = "";
    var turn = document.createElement("div");
    turn.className = "turn";
    var hu = document.createElement("div");
    hu.className = "u"; hu.textContent = "> " + text;
    var th = document.createElement("div");
    th.className = "think";
    var an = document.createElement("div");
    an.className = "ans";
    turn.appendChild(hu); turn.appendChild(th); turn.appendChild(an);
    out.appendChild(turn);
    function add(el, t) { el.appendChild(document.createTextNode(t)); window.scrollTo(0, document.body.scrollHeight); }
    function settle() { busy = false; go.disabled = false; sel.disabled = false; q.focus(); }

    var attempt = 0;
    function tryOnce() {
      attempt++;
      // a refusal wrote nothing, but a retry must not stack two answers in one turn
      th.textContent = ""; an.textContent = "";
      var t0 = Date.now(), chunks = 0, rchunks = 0, first = 0, finish = "", done = false;
      stat.textContent = attempt > 1 ? "NPU busy, retrying (" + (attempt - 1) + "/" + RETRIES + ")…"
                                     : "waiting for the first token…";
      var body = { model: model, messages: [{ role: "user", content: text }],
                   max_tokens: MAXTOK, temperature: 0, stream: true,
                   enable_thinking: !!think.checked };
      fetch(api + "/api/v1/chat/completions", { method: "POST", headers: headers(), body: JSON.stringify(body) })
        .then(function (r) {
          if (r.status === 503) {
            return r.text().then(function (t) {
              var j = null; try { j = JSON.parse(t); } catch (e) {}
              if (isBusy(j) || r.headers.get("Retry-After")) throw busyErr(waitMs(r));
              throw new Error("HTTP 503" + (j && j.error && j.error.message ? ": " + j.error.message : ""));
            });
          }
          if (r.status === 401) { throw new Error("401 - Lemonade refused the request (keyed mode: the key in /etc/1bit/lemond.conf is wrong or missing - console menu item 1)"); }
          if (!r.ok) { throw new Error("HTTP " + r.status); }
          var reader = r.body.getReader(), dec = new TextDecoder(), buf = "";
          function pump() {
            return reader.read().then(function (res) {
              if (res.done) {
                var bits = [chunks + " answer chunk" + (chunks === 1 ? "" : "s")];
                if (rchunks) bits.push(rchunks + " thinking chunk" + (rchunks === 1 ? "" : "s") + " (dimmed above)");
                bits.push(((Date.now() - t0) / 1000).toFixed(1) + " s");
                if (first) bits.push("first token after " + ((first - t0) / 1000).toFixed(1) + " s");
                var s2 = "done: " + bits.join(", ");
                if (finish) s2 += " (" + finish + ")";
                if (!done) s2 += " - the backend ended the stream without [DONE]";
                // The two shapes that used to look identical from the outside ("done: 0 chunks"): thinking ate
                // the budget, and thinking is all the model did. Both name the switch that fixes them.
                if (!chunks && rchunks) s2 += " - no answer text: the model spent its budget thinking, untick 'show thinking'";
                else if (!chunks && finish === "length") s2 += " - no answer text before max_tokens (" + MAXTOK + ")";
                stat.textContent = s2;
                out.appendChild(document.createElement("div"));
                if (th.textContent) th.textContent = "[thinking] " + th.textContent;
                settle();
                return;
              }
              buf += dec.decode(res.value, { stream: true });
              var lines = buf.split("\n"); buf = lines.pop();
              lines.forEach(function (l) {
                l = l.trim();
                if (l.indexOf("data:") !== 0) return;
                var pay = l.slice(5).trim();
                if (pay === "[DONE]") { done = true; return; }
                var j; try { j = JSON.parse(pay); } catch (e) { return; }
                if (j.error) {
                  // engine#924's streaming refusal is ONE `data: {"error":{"message":...}}` frame and then
                  // [DONE] - and it carries no `type`, so the message is what says "the NPU is busy with another
                  // request". A stream that failed before it produced anything is retried whatever it said (that
                  // is exactly the c17 "0 chunks" shape).
                  var why = (j.error && j.error.message) || "the backend reported an error";
                  // Retry ONLY on a stream that has produced NOTHING - no answer chunk and no reasoning chunk -
                  // because a retry clears this turn's two output elements: doing it after any text would
                  // silently replace what the reader already has, and reasoning-only output is text too
                  // (engine#924's own refusal shape is a reasoning-only stream). A failure after output is
                  // reported and the output is kept.
                  if (!chunks && !rchunks) throw busyErr(1000, why);
                  throw new Error(why + " (after " + (chunks + rchunks) + " chunk(s); the partial answer is kept)");
                }
                var ch = (j.choices && j.choices[0]) || {};
                if (ch.finish_reason) finish = ch.finish_reason;
                var d = ch.delta || {};
                if (d.reasoning_content) {
                  rchunks++;
                  add(th, d.reasoning_content);
                  if (!chunks) stat.textContent = "thinking… " + rchunks + " chunk" + (rchunks === 1 ? "" : "s") +
                    " (the model reasons before it answers; untick 'show thinking' for a direct answer)";
                }
                if (d.content) {
                  if (!first) first = Date.now();
                  chunks++;
                  add(an, d.content);
                  stat.textContent = "streaming… " + chunks + " chunk" + (chunks === 1 ? "" : "s");
                }
              });
              return pump();
            });
          }
          return pump();
        })
        .catch(function (e) {
          if (e && e.busy) {
            if (attempt <= RETRIES) {
              var s = Math.max(1, Math.round((e.waitMs || 1000) / 1000));
              stat.textContent = "NPU busy, retrying (" + attempt + "/" + RETRIES + ") in " + s + " s";
              setTimeout(tryOnce, e.waitMs || 1000);
              return;
            }
            stat.textContent = "NPU busy: still refused after " + attempt + " attempts (" + (e.why || "device_busy") +
              ") - press Send again in a moment";
            settle();
            return;
          }
          var err = document.createElement("div");
          err.className = "ans"; err.textContent = "[" + e + "]";
          out.appendChild(err);
          stat.textContent = "failed: " + e;
          settle();
        });
    }
    fill().then(function () { tryOnce(); })
          .catch(function (e) {
              var err = document.createElement("div");
              err.className = "ans"; err.textContent = "[" + e + "]";
              out.appendChild(err);
              stat.textContent = "failed: " + e;
              settle();
          });
  }
  go.addEventListener("click", ask);
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") ask(); });
  // The picker fills itself at load, so the model is on screen before the first prompt (item 2's ask). A failure
  // here is not fatal: ask() retries it, and the line says what the server said.
  fill().catch(function (e) { stat.textContent = "no model list yet: " + e; });
  q.focus();
})();
</script>
