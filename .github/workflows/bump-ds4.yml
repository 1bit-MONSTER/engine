#
# Keep third_party/ds4 on upstream antirez/ds4 main (docs/dwarfstar.md): when
# upstream moves, open a PR here moving the submodule. GitHub-hosted CI has no
# GPU; rerun scripts/build-ds4.sh and the checks in docs/dwarfstar.md on Strix
# Halo before merging.
#
# Uses the secret HRX_BUMP_TOKEN (Contents and Pull requests read/write on
# 1bit-MONSTER/engine): a PR opened with the default GITHUB_TOKEN would not
# start CI.
name: bump-ds4

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-ds4
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with upstream
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/antirez/ds4/commits/main --jq .sha)
          ours=$(git ls-tree HEAD third_party/ds4 | awk '{print $3}')
          echo "upstream $upstream, ours $ours"
          {
            echo "upstream=$upstream"; echo "ours=$ours"
            if [ "$upstream" = "$ours" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          OURS: ${{ steps.pins.outputs.ours }}
        run: |
          set -euo pipefail
          branch="bump-ds4/${UPSTREAM:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          log=$(gh api "repos/antirez/ds4/compare/${OURS}...${UPSTREAM}" \
                  --jq '.commits[-30:][] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' || true)
          git config user.name "ds4-bump"
          git config user.email "ds4-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$UPSTREAM,third_party/ds4"
          git commit -q -m "Bump DwarfStar: antirez/ds4 ${UPSTREAM:0:12}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump DwarfStar: antirez/ds4 ${UPSTREAM:0:12}" \
            --body "Moves third_party/ds4 from \`${OURS:0:12}\` to upstream main \`${UPSTREAM:0:12}\`.

          Upstream commits (last 30):
          ${log}

          CI here has no GPU. Before merging, on Strix Halo:
          \`DS4_TEST=1 scripts/build-ds4.sh ~/.cache/ds4-pin rocm\` (builds, then runs DwarfStar's model-free routed-MoE GPU test), then \`1bit serve --device ds4 -m <DeepSeek V4 Flash Q2 .gguf> --ctx-size 8192\` answers a chat request (docs/dwarfstar.md)."
