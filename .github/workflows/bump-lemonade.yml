#
# Keep third_party/lemonade on our fork's main (docs/lemonade.md): 1bit-MONSTER/lemonade
# follows upstream lemonade-sdk/lemonade daily (sync-lemonade-fork.yml); when the fork
# moves, open a PR here moving the submodule. Before merging, on Strix Halo: build with
# scripts/build-lemonade.sh and run Lemonade's LLM suite through the onebit recipe.
#
# Uses the secret HRX_BUMP_TOKEN (Contents and Pull requests read/write on
# 1bit-MONSTER/engine): a PR opened with the default GITHUB_TOKEN would not
# start CI.
name: bump-lemonade

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write            # the failure step files/refreshes an issue (see the last step)

concurrency:
  group: bump-lemonade
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with upstream
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/1bit-MONSTER/lemonade/commits/main --jq .sha)
          ours=$(git ls-tree HEAD third_party/lemonade | awk '{print $3}')
          echo "upstream $upstream, ours $ours"
          {
            echo "upstream=$upstream"; echo "ours=$ours"
            if [ "$upstream" = "$ours" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          OURS: ${{ steps.pins.outputs.ours }}
        run: |
          set -euo pipefail
          branch="bump-lemonade/${UPSTREAM:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          log=$(gh api "repos/1bit-MONSTER/lemonade/compare/${OURS}...${UPSTREAM}" \
                  --jq '.commits[-30:][] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' || true)
          git config user.name "lemonade-bump"
          git config user.email "lemonade-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$UPSTREAM,third_party/lemonade"
          git commit -q -m "Bump Lemonade: 1bit-MONSTER/lemonade ${UPSTREAM:0:12}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump Lemonade: 1bit-MONSTER/lemonade ${UPSTREAM:0:12}" \
            --body "Moves third_party/lemonade from \`${OURS:0:12}\` to the fork's main \`${UPSTREAM:0:12}\`.

          Fork commits (last 30):
          ${log}

          CI here has no GPU. Before merging, on Strix Halo:
          \`scripts/build-lemonade.sh ~/.cache/lemonade-pin\`, then Lemonade's LLM suite through the onebit recipe (docs/lemonade.md)."

      # A failing scheduled job that tells no one is the defect (bump-hrx 2026-10-01..05 and bump-ds4
      # 2026-10-21..30 both froze a pin that way). This step makes it speak.
      - name: Report a failed sync so it cannot break silently
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}   # least privilege: no PAT needed to speak in this repo
        run: |
          set -euo pipefail
          title="bump-lemonade: the scheduled Lemonade pin sync is failing"
          body="The scheduled run $GITHUB_RUN_ID failed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          this workflow only follows our fork (\`1bit-MONSTER/lemonade\` main), which \`sync-lemonade-fork.yml\` advances from upstream daily, so a failure is usually the fork being behind or the PR step losing a race. Check \`sync-lemonade-fork.yml\` first, then re-run this one.

          Why this step exists: bump-lemonade had no failure step, so a red scheduled run told no one (2026-10-30; the DwarfStar sibling had been failing silently for ten days)."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
