#
# The HRX build at PR time (engine#1077, docs/hw-gate.md "The HRX build check"). ci.yml configures
# the engine without ONEBIT_HRX, so it never enters cmake/hrx.cmake, and hw-gate.yml runs only on a
# labelled PR or a bump-hrx/* branch: before this job, ggml/src/ggml-hrx in the pinned
# third_party/llama.cpp was compiled by no job at PR time, pin bumps included.
#
# What it runs: the engine configured with -DONEBIT_HRX=ON and `cmake --build --target onebit`,
# which builds llama_hrx (llama.cpp with GGML_HRX=ON, and hrx-system from the pinned tree, through
# cmake/hrx.cmake) and then links onebit with its HRX wiring. A compile and a link only: no device,
# no GPU token, no NPU lock. The public plumbing only: the private HIP add-on is the hardware
# gate's job (hw-gate.yml), so this log never shows private source.
#
# Cost: $0 Actions spend. It is a self-hosted job on the box's engine runner, never a hosted one.
# The build tree persists under ~/.cache/hrx-build/bench on the box and llama_hrx is BUILD_ALWAYS, so a
# PR rebuilds what it changed; a pin bump pays the full build once. It runs on the build's own
# inputs only (the paths below), not on every PR.
#
# Runner: [self-hosted, strixhalo, bench], the box's bench runner, not the pr-agent one: a cold build
# holds its runner for a while, and on the pr-agent runner it queued every PR-Agent review behind it
# (engine#1077; owner 2026-11-06: move it to bench). Same box, so TheRock at /opt/rocm-therock
# (cmake/hrx.cmake's default without a fetched SDK). The runner runs one job at a time, and the tree
# is its own (~/.cache/hrx-build/bench), so no two runs share a tree.
# The build runs under ~/lb/thermal-run.sh (4 cores, paused at 78 C) like every build on the box.
# A PR whose only trigger change is test registration in CMakeLists.txt (add_test/set_tests_properties lines,
# comments, blanks) configures with ONEBIT_HRX=ON and skips the compile: such a line creates no target and sets
# no flag, but it is still evaluated at configure time, including inside if(ONEBIT_HRX) blocks ci.yml never
# configures. tools/ci/hrx_build_scope.py decides; anything it does not recognise builds.
# Fork PRs never reach the box: the `if:` requires the head repository to be this one.
name: hrx-build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - third_party/llama.cpp
      - third_party/hrx-system
      - CMakeLists.txt
      - cmake/hrx.cmake
      - config/hrx-toolchain.config
      - config/hrx-system-hold.config
      - app/serve.cpp
      - .github/workflows/hrx-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hrx_build:
    runs-on: [self-hosted, strixhalo, bench]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: hrx-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # a cold build (both pins moved) on 4 throttled cores; an incremental one takes minutes
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          # the PR's merge commit and its first parent (the base), for the scope step
          fetch-depth: 2

      - name: Scope (compile, or configure only)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          verdict=full
          if [ "$EVENT" = pull_request ]; then
            # prints full or configure-only (exit 0 for configure-only, 10 for full); a crash prints neither
            verdict=$(python3 tools/ci/hrx_build_scope.py --base HEAD^1 --head HEAD) || true
          fi
          if [ "$verdict" = configure-only ]; then echo "build=false"; else echo "build=true"; fi >> "$GITHUB_OUTPUT"

      - name: Check out the HRX pair (llama.cpp + hrx-system)
        run: |
          set -euo pipefail
          git submodule sync -- third_party/llama.cpp third_party/hrx-system
          git -c protocol.version=2 submodule update --init --depth 1 third_party/llama.cpp third_party/hrx-system
          git submodule status -- third_party/llama.cpp third_party/hrx-system
          # outside the checkout, which actions/checkout cleans: the tree persists across runs
          echo "HRX_BUILD=$HOME/.cache/hrx-build/bench" >> "$GITHUB_ENV"

      - name: Configure with ONEBIT_HRX=ON
        run: |
          set -euo pipefail
          ~/lb/thermal-run.sh cmake -S . -B "$HRX_BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DONEBIT_HRX=ON

      - name: Configure only (test registration, no compile)
        if: steps.scope.outputs.build != 'true'
        run: echo "only test registration changed in CMakeLists.txt; the ONEBIT_HRX=ON configure above passed, the compile is skipped" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build llama_hrx and onebit
        if: steps.scope.outputs.build == 'true'
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ~/lb/thermal-run.sh cmake --build "$HRX_BUILD" --target onebit -j 4
          # the build must have produced the HRX backend and the server onebit runs
          ls -l "$HRX_BUILD"/hrx/llama/bin/llama-server
          find "$HRX_BUILD"/hrx/llama -name 'libggml-hrx.so*' -print -quit | grep .
