#
# Keep third_party/llama.cpp and third_party/hrx-system on the pair AMD's
# integration repo (ROCm/ggml-staging-automation) builds and tests together
# (docs/hrx.md, "Staying current"). The engine pins 1bit/hrx-vulkan-patched: AMD's
# commit plus our own commits on top. When AMD moves its pins, this workflow:
#   1. syncs 1bit-MONSTER/llama.cpp: master to ggml-org, 1bit/hrx-vulkan to AMD's pin;
#   2. MERGES AMD's pin into 1bit/hrx-vulkan-patched, tagging the previous tip so the
#      commit the engine pins stays reachable;
#   3. opens a PR here moving both submodules.
#
# Why a merge and not a rebase (measured 2026-10-06): our patched line carries 159 of our own
# commits and AMD's pin had moved 70 commits, over the same files. Rebasing replays all 159 and
# died at commit 1 of 159 (dispatch-mul-mat.cpp), so the job failed on every scheduled run from
# 2026-10-01 to 2026-10-05 and the HRX pin silently froze while AMD and our fork both moved.
# Merging the same two lines conflicts in 15 files, all under ggml/src/ggml-hrx/. The llama.cpp
# merge resolves those toward our patched line (measured: AMD core + our ggml-hrx passes the
# full HRX0 gate with 0 NaN; AMD's ggml-hrx fails 54 cases and yields NaN, engine#315) and takes
# AMD's side elsewhere. A conflict outside ggml/src/ggml-hrx, or in hrx-system, still fails the
# run: resolve those files by hand.
# A failed run now files an issue, so it cannot break silently for another five days.
# GitHub-hosted CI builds that PR without HRX; run tests/serve_e2e.sh on
# Strix Halo before merging it.
#
# Needs the secret HRX_BUMP_TOKEN: a fine-grained token with Contents
# read/write on 1bit-MONSTER/llama.cpp and 1bit-MONSTER/engine, Workflows
# read/write on 1bit-MONSTER/llama.cpp, and Pull requests read/write on
# 1bit-MONSTER/engine. Syncing upstream can update workflow files, which needs
# the Workflows permission. (A PR opened with the default GITHUB_TOKEN would
# not start CI, and that token cannot push to the fork.)
name: bump-hrx

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bump-hrx
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}
          persist-credentials: true

      - name: Read AMD's tested pair and ours
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          amd_llama=$(gh api repos/ROCm/ggml-staging-automation/contents/llama.cpp --jq .sha)
          amd_hrx=$(gh api repos/ROCm/ggml-staging-automation/contents/hrx-system --jq .sha)
          ours_llama=$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')
          ours_hrx=$(git ls-tree HEAD third_party/hrx-system | awk '{print $3}')
          # the AMD commit our patches sit on
          ours_base=$(git ls-remote https://github.com/1bit-MONSTER/llama.cpp.git refs/heads/1bit/hrx-vulkan | awk '{print $1}')
          echo "AMD:  llama.cpp $amd_llama  hrx-system $amd_hrx"
          echo "ours: llama.cpp $ours_llama (on AMD $ours_base)  hrx-system $ours_hrx"
          {
            echo "amd_llama=$amd_llama"; echo "amd_hrx=$amd_hrx"
            echo "ours_llama=$ours_llama"; echo "ours_hrx=$ours_hrx"; echo "ours_base=$ours_base"
            if [ "$amd_llama" = "$ours_base" ] && [ "$amd_hrx" = "$ours_hrx" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Sync the fork and merge AMD's pin into our line
        id: fork
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          AMD_LLAMA: ${{ steps.pins.outputs.amd_llama }}
          OURS_BASE: ${{ steps.pins.outputs.ours_base }}
        run: |
          set -euo pipefail
          # master mirrors ggml-org; 1bit/hrx-vulkan carries no commits of its own, so it
          # moves to AMD's pin as long as that pin descends from it (no force needed).
          gh api -X POST repos/1bit-MONSTER/llama.cpp/merge-upstream -f branch=master > /dev/null
          git init -q fork && cd fork
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/1bit-MONSTER/llama.cpp.git"
          git remote add amd https://github.com/AMD-Ecosystem/llama.cpp.git
          git fetch -q --filter=blob:none amd "$AMD_LLAMA"
          git fetch -q --filter=blob:none fork 1bit/hrx-vulkan
          if ! git merge-base --is-ancestor FETCH_HEAD "$AMD_LLAMA"; then
            echo "::error::1bit/hrx-vulkan has commits that AMD's pin does not contain; rebase them by hand"
            exit 1
          fi
          git push -q fork "$AMD_LLAMA:refs/heads/1bit/hrx-vulkan"

          # Merge (not rebase) AMD's pin into our line, in a clone whose only (partial) remote is
          # the fork, which now holds AMD's pin too. Rebasing our 159 commits died at commit 1 of
          # 159; the same two lines merge with 15 conflicting files, all under ggml/src/ggml-hrx/.
          cd .. && git init -q patched && cd patched
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/1bit-MONSTER/llama.cpp.git"
          git fetch -q --filter=blob:none fork 1bit/hrx-vulkan
          git fetch -q --filter=blob:none fork 1bit/hrx-vulkan-patched
          patched=$(git rev-parse FETCH_HEAD)
          rebased=$patched
          if [ "$OURS_BASE" != "$AMD_LLAMA" ]; then
            git checkout -q --detach "$patched"
            if ! git -c user.name=hrx-bump -c user.email=hrx-bump@users.noreply.github.com merge --no-edit --no-ff "$AMD_LLAMA"; then
              conflicts=$(git diff --name-only --diff-filter=U || true)
              outside=$(printf '%s\n' "$conflicts" | grep -v '^ggml/src/ggml-hrx/' | grep -v '^$' || true)
              if [ -n "$outside" ]; then
                git merge --abort || true
                echo "::error::merging AMD's ${AMD_LLAMA:0:12} into 1bit/hrx-vulkan-patched conflicts outside ggml/src/ggml-hrx: $(printf '%s ' $outside); resolve those files by hand"
                exit 1
              fi
              # Every conflict is inside our HRX backend. Take ours (the branch being merged
              # into, i.e. the patched line) and keep the rest of AMD's pin.
              #
              # Measured 2026-10-06, fresh builds with this workflow's own ExternalProject
              # arguments - AMD's core plus our ggml-hrx: full gate test-backend-ops -b HRX0
              # 1073/1073 with 0 FAIL, and GLM-4.7-Flash at -ub 512 returns " Paris." with 0
              # NaN events. AMD's own ggml-hrx on the same core: 1019/1071 with 54 FAIL and 18
              # NaN events (engine#315). Resolving these 15 files toward AMD's side therefore
              # imports that NaN into the pinned line, so the merge keeps our files.
              # Our side may have DELETED a file AMD changed (modify/delete). `git checkout --ours`
              # cannot apply to a path we do not have, which leaves the merge uncommitted and makes
              # `git commit` fail. Keep our deletion, which is what this line already ships.
              printf '%s\n' "$conflicts" | while read -r path; do
                [ -n "$path" ] || continue
                if git cat-file -e ":2:$path" 2>/dev/null; then
                  git checkout --ours -- "$path" && git add -- "$path"
                else
                  echo "::notice::kept our deletion of $path (modify/delete conflict)"
                  git rm -q -f -- "$path"
                fi
              done
              git -c user.name=hrx-bump -c user.email=hrx-bump@users.noreply.github.com commit -q --no-edit
              echo "::notice::merged AMD's ${AMD_LLAMA:0:12} keeping our ggml/src/ggml-hrx for: $(printf '%s ' $conflicts)"
            fi
            rebased=$(git rev-parse HEAD)
            # keep the commit the engine pins now reachable before moving the branch
            git tag -f "patched-${patched:0:12}" "$patched"
            git push -q fork "refs/tags/patched-${patched:0:12}"
            git push -q --force-with-lease="refs/heads/1bit/hrx-vulkan-patched:$patched" fork "$rebased:refs/heads/1bit/hrx-vulkan-patched"
          fi
          {
            echo "rebased=$rebased"
            echo "patches<<EOF"; git log --format='- `%h` %s' "$AMD_LLAMA..$rebased"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # hrx-system is the OTHER HALF of AMD's tested pair. The engine pins our fork's 1bit/main
      # (ROCm/hrx-system at AMD's pin plus our commits), and .gitmodules records that it is rebased
      # by hand — which is why an unextended workflow leaves it behind every time AMD moves. Same
      # merge-not-rebase treatment as llama.cpp above.
      - name: Merge AMD's hrx-system pin into our line
        id: hrxfork
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          AMD_HRX: ${{ steps.pins.outputs.amd_hrx }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: |
          set -euo pipefail
          git init -q hrxsystem && cd hrxsystem
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/1bit-MONSTER/hrx-system.git"
          git remote add amd https://github.com/ROCm/hrx-system.git
          # AMD's pin first, then our branch into an explicit ref, so FETCH_HEAD ordering cannot bite
          # (a bare FETCH_HEAD read after two fetches silently compares the wrong pair).
          git fetch -q --filter=blob:none amd "$AMD_HRX" || git fetch -q --filter=blob:none fork "$AMD_HRX"
          git fetch -q --filter=blob:none fork 1bit/main:refs/remotes/fork/1bit-main
          ours=$(git rev-parse refs/remotes/fork/1bit-main)
          hrx_rebased=$ours
          if [ "$OURS_HRX" != "$AMD_HRX" ]; then
            git checkout -q --detach "$ours"
            if ! git -c user.name=hrx-bump -c user.email=hrx-bump@users.noreply.github.com merge --no-edit --no-ff "$AMD_HRX"; then
              conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ' || true)
              git merge --abort || true
              echo "::error::merging AMD's hrx-system ${AMD_HRX:0:12} into 1bit-MONSTER/hrx-system 1bit/main conflicts in: ${conflicts}; resolve those files by hand"
              exit 1
            fi
            hrx_rebased=$(git rev-parse HEAD)
            # keep the commit the engine pins now reachable before moving the branch
            git tag -f "main-${ours:0:12}" "$ours"
            git push -q fork "refs/tags/main-${ours:0:12}"
            git push -q --force-with-lease="refs/heads/1bit/main:$ours" fork "$hrx_rebased:refs/heads/1bit/main"
          fi
          echo "hrx_rebased=$hrx_rebased" >> "$GITHUB_OUTPUT"

      # Our ggml-hrx backend (ggml/src/ggml-hrx in the llama.cpp fork) is compiled against the LoomC
      # headers of hrx-system. AMD removes public LoomC symbols without notice (2026-10-07: loom 32d0c76a
      # dropped loomc_amdgpu_runtime_global_flags_t and loomc_amdgpu_emit_options_t, used by our
      # loom-jit.cpp). CI here builds without HRX, so #353, #357 and #361 merged a pair that did not
      # compile with ONEBIT_HRX=ON, and #359 / #363 had to pin hrx-system back by hand (KNOWN-ISSUES.md).
      # Cheap header-level check: every loomc_* / LOOMC_* identifier our backend uses must still be
      # declared under loom/binding/c/include at the new hrx-system revision. If one is missing, the PR
      # moves llama.cpp only and keeps hrx-system where it is, and says so.
      - name: Hold hrx-system if our ggml-hrx uses LoomC symbols the new revision dropped
        id: compat
        if: steps.pins.outputs.changed == 'true'
        env:
          REBASED: ${{ steps.fork.outputs.rebased }}
          HRX_REBASED: ${{ steps.hrxfork.outputs.hrx_rebased }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: |
          set -euo pipefail
          hrx_pin="$HRX_REBASED"
          held=""
          if [ "$HRX_REBASED" != "$OURS_HRX" ]; then
            used=$(cd patched && git ls-tree -r --name-only "$REBASED" -- ggml/src/ggml-hrx \
              | grep -E '\.(c|cc|cpp|h|hpp)$' \
              | while read -r f; do git show "$REBASED:$f"; done \
              | grep -oE '\b(loomc_[A-Za-z0-9_]+|LOOMC_[A-Z0-9_]+)\b' | sort -u)
            headers=$(cd hrxsystem && git ls-tree -r --name-only "$HRX_REBASED" -- loom/binding/c/include \
              | while read -r f; do git show "$HRX_REBASED:$f"; done)
            missing=""
            for sym in $used; do
              printf '%s\n' "$headers" | grep -qF -- "$sym" || missing="$missing $sym"
            done
            if [ -n "$missing" ]; then
              echo "::warning::hrx-system ${HRX_REBASED:0:12} no longer declares:${missing}. Keeping third_party/hrx-system at ${OURS_HRX:0:12} until ggml-hrx is ported (KNOWN-ISSUES.md, engine#359/#363)."
              hrx_pin="$OURS_HRX"
              held="hrx-system HELD at \`${OURS_HRX:0:12}\`: our ggml-hrx still uses LoomC symbols that \`${HRX_REBASED:0:12}\` dropped (${missing## }). Port ggml/src/ggml-hrx first, then move it."
            else
              echo "every LoomC symbol our ggml-hrx uses ($(printf '%s\n' $used | wc -l)) is declared at hrx-system ${HRX_REBASED:0:12}"
            fi
          fi
          {
            echo "hrx_pin=$hrx_pin"
            echo "held=$held"
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          AMD_LLAMA: ${{ steps.pins.outputs.amd_llama }}
          AMD_HRX: ${{ steps.pins.outputs.amd_hrx }}
          REBASED: ${{ steps.fork.outputs.rebased }}
          HRX_REBASED: ${{ steps.compat.outputs.hrx_pin }}
          HRX_HELD: ${{ steps.compat.outputs.held }}
          PATCHES: ${{ steps.fork.outputs.patches }}
          OURS_LLAMA: ${{ steps.pins.outputs.ours_llama }}
          OURS_HRX: ${{ steps.pins.outputs.ours_hrx }}
        run: |
          set -euo pipefail
          if [ "$REBASED" = "$OURS_LLAMA" ] && [ "$HRX_REBASED" = "$OURS_HRX" ]; then
            echo "::notice::nothing to move: llama.cpp stays at ${OURS_LLAMA:0:12} and hrx-system is held at ${OURS_HRX:0:12}"
            exit 0
          fi
          branch="bump-hrx/${AMD_LLAMA:0:12}-${HRX_REBASED:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          git config user.name "hrx-bump"
          git config user.email "hrx-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$REBASED,third_party/llama.cpp"
          git update-index --cacheinfo "160000,$HRX_REBASED,third_party/hrx-system"
          git commit -q -m "Bump HRX: llama.cpp ${AMD_LLAMA:0:12} + hrx-system ${HRX_REBASED:0:12} (AMD's tested pair)"
          scripts/registry-regen.sh  # the registry must record the new pin (ctest registry_pins)
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump HRX: llama.cpp ${AMD_LLAMA:0:12} + hrx-system ${HRX_REBASED:0:12} (AMD's tested pair)" \
            --body "Moves BOTH submodules onto the pair ROCm/ggml-staging-automation now pins, each merged with our own commits (the workflow performs the merge; a conflict fails the run and names the files).

          | | from | to |
          |---|---|---|
          | third_party/llama.cpp (1bit-MONSTER/llama.cpp 1bit/hrx-vulkan-patched) | \`${OURS_LLAMA:0:12}\` | \`${REBASED:0:12}\` (on AMD \`${AMD_LLAMA:0:12}\`) |
          | third_party/hrx-system (1bit-MONSTER/hrx-system 1bit/main) | \`${OURS_HRX:0:12}\` | \`${HRX_REBASED:0:12}\` (on AMD \`${AMD_HRX:0:12}\`) |

          ${HRX_HELD}

          Our commits, rebased onto AMD's pin:
          ${PATCHES}

          CI here builds without HRX. Before merging, on Strix Halo run the long-prompt correctness
          probe and \`test-backend-ops -b HRX0\`; record the exact validated hrx-system pin in
          \`config/hrx-long-prompt-validated-pin\`:
          \`python3 tests/hrx_long_prompt.py\`
          \`cmake -B build -G Ninja -DONEBIT_HRX=ON && cmake --build build --target onebit && for d in hrx cpu; do tests/serve_e2e.sh build/1bit <Qwen3-0.6B Q4_K_M .gguf> \$d; done\`"

      # This workflow failed on EVERY scheduled run from 2026-10-01 to 2026-10-05 and nobody
      # noticed, so the HRX pin silently froze at the old commit. A failing scheduled job that
      # tells no one is the actual defect; this step makes it speak.
      - name: Report a failed sync so it cannot break silently
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}   # least privilege: no PAT needed to speak in this repo
        run: |
          set -euo pipefail
          title="bump-hrx: the scheduled HRX pin sync is failing"
          body="The bump-hrx run $GITHUB_RUN_ID failed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Look at the sync steps ('Sync the fork and merge AMD's pin into our line', 'Merge AMD's hrx-system pin into our line'). If one is a merge conflict, the conflicting files are named in the log; resolve them by hand on \`1bit/hrx-vulkan-patched\` or on \`1bit-MONSTER/hrx-system\` \`1bit/main\`, then re-run this workflow.

          Why this step exists: bump-hrx failed on every scheduled run from 2026-10-01 to 2026-10-05 without anyone noticing, and the HRX pin silently froze."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
