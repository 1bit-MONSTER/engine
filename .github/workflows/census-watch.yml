#
# Intent: run the daily HF new-model watcher (tools/census_watch.py, via
# scripts/census-watch.sh) and alert when a newly-published model carries an architecture
# class the registry (registry/architectures.json) does not map. That is the one thing
# that silently moves the mapped share the census reports — this workflow turns it into a
# red check plus a deduped alert issue.
#
# The same entry point backs the 04:30 systemd timer on the development box
# (scripts/1bit-census-watch.{service,timer}); CI here is the second, self-hosted-free
# alert path (ubuntu-latest, stdlib python only — the registry is generated data, so
# unlike 1bit-MONSTER's watcher there is no g++ probe to compile).
#
# NOTE: scheduled runs only fire on the default branch. workflow_dispatch is the manual
# trigger for feature branches.
#
# Deliberately no pull_request trigger. The live watch is red whenever any newest model's
# class is unmapped — that is the alert — and the census reports a mapped share below
# 100% by design, so a PR gate would be red on every pull request and mean nothing. The
# watcher's own contract is checked offline by ctest `census_watch` (tests/census_watch_test.py,
# run by ci.yml), which needs no network and no HF state; the live alert runs on schedule.
#
# Gated/no-config models do NOT fail the run — they are unverifiable without an HF token
# and expected; only genuinely uncovered classes alert.
#
# The same run also watches FastFlowLM's HF org and runtime releases (engine #588, inside
# tools/census_watch.py). A repo whose architecture the registry does not map prints
# `!! NEW FLM` and is the alert too: exit 1 either way, so neither source can turn the
# other's alert green. A release whose notes name the q4nx/chunk/layout container is
# printed as `kernel-format` for the issue body but does not alert on its own.
#
# Only exit 1 files an issue. Exit 2 means a watch did not run (no network, an unreadable
# listing) — that stays a red check, not a coverage-breach issue, so a network hiccup
# cannot file a bogus "class uncovered" report.
#
# Permissions (RFC #246): the workflow token is read-only by default. Only the `alert` job holds
# `issues: write`. It never checks out or runs repository code; it only reads the watch job's
# filtered output, which carries Hugging Face model ids and class names (untrusted text). Those
# go into the issue inside a code fence with backticks and '@' stripped, capped at 40 lines, so
# they cannot close the fence, mention anyone or add links.

name: Census watch

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC daily, ahead of the 05:17 census sweep
  workflow_dispatch:
    inputs:
      simulate_alert:
        description: "Test the alert path: file the issue as if an uncovered class arrived"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: census-watch
  cancel-in-progress: false

jobs:
  watch:
    name: New HF model classes are covered
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      alert: ${{ steps.watch.outputs.alert }}
      lines: ${{ steps.watch.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # The watcher's state file (the model ids already classified) is not carried between CI
      # runs, so the newest models are re-checked every run; the alert job dedupes.
      - name: Run the new-model watcher
        id: watch
        env:
          SIMULATE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_alert }}
        run: |
          set +e
          bash scripts/census-watch.sh --limit 120 > /tmp/census-watch.log 2>&1
          rc=$?
          cat /tmp/census-watch.log
          if [ "$SIMULATE" = "true" ]; then
            echo "  !! UNCOVERED SimulatedForTestingClass (new class): 1 model(s), e.g. example/simulated" >> /tmp/census-watch.log
            rc=1
          fi
          lines=$(grep -E "UNCOVERED|UNVERIFIABLE|REMOTE-CODE|NEW FLM|NPU FLM|kernel-format|Q4NX (NPU)" /tmp/census-watch.log | tr -d '`@' | head -n 40 | base64 -w0)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          if [ $rc -eq 1 ]; then echo "alert=true" >> "$GITHUB_OUTPUT"; fi
          exit $rc

  alert:
    name: File a deduped alert issue
    needs: watch
    # only when the watcher itself reported an uncovered class (not on checkout/setup failures)
    if: always() && needs.watch.outputs.alert == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File it, or append it to the open alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINES: ${{ needs.watch.outputs.lines }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create census-watch --color B60205 --description "Daily new-model watcher alert" 2>/dev/null || true
          # One issue at a time, but a *new* breach must never be swallowed by an issue that is
          # already open - that is what happened on 2026-10-27: #619 stayed open, so
          # FastFlowLM/LFM3-1.7B-NPU2 (10-28) and MiniCPM-V-4.7-35B-A3B-NPU2 (10-30) alerted
          # every day in CI and were recorded nowhere. The marker is a digest of the alert
          # lines: the same breach is a no-op, a changed one is one comment on the open issue.
          marker="<!-- census-watch: $(printf '%s' "$LINES" | sha256sum | cut -d' ' -f1) -->"
          {
            echo "## Census coverage breach ($(date -u +%Y-%m-%d))"
            echo ""
            echo "The daily new-model watcher found Hugging Face models whose architecture class is not"
            echo "mapped by the engine registry (\`registry/architectures.json\`), a FastFlowLM"
            echo "repo publishing a model family this engine does not serve, or a Q4NX (NPU) pack for"
            echo "a family only a non-NPU backend serves (engine #588):"
            echo ""
            echo '```'
            printf '%s' "$LINES" | base64 -d
            echo '```'
            echo ""
            echo "Fix: map the class in \`registry/architectures.json\` when a pinned backend's code really"
            echo "accepts the architecture, or serve the family on the NPU route when the pack asks for"
            echo "it, or record why it is not an alias in \`registry/significant.json\`"
            echo "and \`docs/arch-gaps.md\` (a class reviewed as significant needs real engine support, not a"
            echo "mapping). Re-run \`python3 tools/census_watch.py\` to confirm."
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            echo "$marker"
          } > /tmp/census_issue.md
          open=$(gh issue list --label census-watch --state open --json number --jq '.[0].number // ""')
          if [ -n "$open" ]; then
            seen=$(gh issue view "$open" --json body,comments \
              --jq '[.body // ""] + [.comments[].body // ""] | join("\n")' | grep -cF "$marker" || true)
            if [ "${seen:-0}" -gt 0 ]; then
              echo "#${open} already carries this breach: nothing to do"
              exit 0
            fi
            gh issue comment "$open" --body-file /tmp/census_issue.md
            echo "appended this breach to #${open}"
            exit 0
          fi
          gh issue create --title "census: new HF model class uncovered by the registry" \
            --label census-watch --body-file /tmp/census_issue.md
