#
# Keep third_party/zinc on upstream zolotukhin/zinc main (docs/zinc.md): when
# upstream moves, open a PR here moving the submodule. GitHub-hosted CI has no
# GPU; rerun scripts/build-zinc.sh and the smoke test in docs/zinc.md on Strix
# Halo before merging.
#
# Uses the secret HRX_BUMP_TOKEN (Contents and Pull requests read/write on
# 1bit-MONSTER/engine): a PR opened with the default GITHUB_TOKEN would not
# start CI.
name: bump-zinc

on:
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-zinc
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with upstream
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/zolotukhin/zinc/commits/main --jq .sha)
          ours=$(git ls-tree HEAD third_party/zinc | awk '{print $3}')
          echo "upstream $upstream, ours $ours"
          {
            echo "upstream=$upstream"; echo "ours=$ours"
            if [ "$upstream" = "$ours" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          OURS: ${{ steps.pins.outputs.ours }}
        run: |
          set -euo pipefail
          branch="bump-zinc/${UPSTREAM:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          log=$(gh api "repos/zolotukhin/zinc/compare/${OURS}...${UPSTREAM}" \
                  --jq '.commits[-30:][] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' || true)
          git config user.name "zinc-bump"
          git config user.email "zinc-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$UPSTREAM,third_party/zinc"
          git commit -q -m "Bump ZINC: zolotukhin/zinc ${UPSTREAM:0:12}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump ZINC: zolotukhin/zinc ${UPSTREAM:0:12}" \
            --body "Moves third_party/zinc from \`${OURS:0:12}\` to upstream main \`${UPSTREAM:0:12}\`.

          Upstream commits (last 30):
          ${log}

          CI here has no GPU. Before merging, on Strix Halo:
          \`scripts/build-zinc.sh ~/.cache/zinc-pin vulkan && RADV_PERFTEST=coop_matrix ~/.cache/zinc-pin/vulkan/bin/zinc -m ~/models/Qwen3-0.6B-Q4_K_M.gguf --prompt 'The capital of France is'\` (first token 12095)."
