#
# Move third_party/xdna-driver, the amdxdna kernel driver pin (docs/npu.md, "The
# XDNA driver"), to upstream amd/xdna-driver main: opens a PR moving the
# submodule. Only the kernel driver is pinned here: the engine is XRT-free (its
# NPU runtime is compiled into 1bit), so nothing from the pin is built into the
# release, and XRT (xdna-driver's own xrt submodule) is not tracked.
#
# Run by hand only (workflow_dispatch): a driver move means rebuilding and
# re-signing the out-of-tree module on Strix Halo and running the NPU check
# (docs/npu.md, "Checking the NPU") before merging. GitHub-hosted CI has no NPU.
#
# Uses the secret HRX_BUMP_TOKEN (Contents and Pull requests read/write on
# 1bit-MONSTER/engine): a PR opened with the default GITHUB_TOKEN would not
# start CI.
name: bump-xdna

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-xdna
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with upstream
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/amd/xdna-driver/commits/main --jq .sha)
          ours=$(git ls-tree HEAD third_party/xdna-driver | awk '{print $3}')
          echo "upstream $upstream, ours $ours"
          {
            echo "upstream=$upstream"; echo "ours=$ours"
            if [ "$upstream" = "$ours" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          OURS: ${{ steps.pins.outputs.ours }}
        run: |
          set -euo pipefail
          branch="bump-xdna/${UPSTREAM:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          log=$(gh api "repos/amd/xdna-driver/compare/${OURS}...${UPSTREAM}" \
                  --jq '.commits[-30:][] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' || true)
          git config user.name "xdna-bump"
          git config user.email "xdna-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$UPSTREAM,third_party/xdna-driver"
          git commit -q -m "Bump XDNA driver: amd/xdna-driver ${UPSTREAM:0:12}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump XDNA driver: amd/xdna-driver ${UPSTREAM:0:12}" \
            --body "Moves third_party/xdna-driver (the amdxdna kernel driver pin) from \`${OURS:0:12}\` to upstream main \`${UPSTREAM:0:12}\`.

          Upstream commits (last 30):
          ${log}

          CI here has no NPU. Before merging, on Strix Halo: build the out-of-tree amdxdna module from this commit, sign and load it, and run the NPU check (docs/npu.md, \"Checking the NPU\")."
