# box-hold-lanes.conf -> /etc/1bit/box-hold-lanes.conf: lane names that contain a dash, one per line, so box-hold's per-lane
# queue cap (at most 3 queued per lane) does not read cl-inkling-npu as cl-inkling. Any other lane is its label's first
# two dash tokens (cl-lb-ink1-A -> cl-lb). Add a line when a lane with a dashed name joins the fleet.
cl-inkling-npu
