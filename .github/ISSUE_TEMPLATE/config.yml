# Every issue uses a form; questions, designs and security reports go elsewhere.
blank_issues_enabled: false
contact_links:
  - name: Question or help
    url: https://github.com/1bit-MONSTER/engine/discussions/categories/q-a
    about: Ask in Q&A (Discussions).
  - name: RFC (a larger change)
    url: https://github.com/1bit-MONSTER/engine/discussions/categories/rfcs
    about: New backends, devices, dependencies, formats or APIs start here (CONTRIBUTING.md).
  - name: Security vulnerability
    url: https://github.com/1bit-MONSTER/engine/security/advisories/new
    about: Report privately, never in a public issue (SECURITY.md).
  - name: Discord
    url: https://discord.gg/fa5m4Vawpa
    about: Chat with other 1bit users.
