#
# /etc/modprobe.d/amdxdna.conf - the NPU's hang detector gets time to recover instead of resetting the device
# under a real chat.
#
# Measured root cause (pi-hrx-fabric, 4 Nov 14:0x, with the c22 stick's own binary, kernels, model, firmware and
# module): this is a WATCHDOG INTERVAL difference, not a firmware or payload fault. The appliance had no modprobe
# override at all, so `tdr_timeout_ms` was the module default 2000 ms; the detector needs two intervals with no
# `aie2_tdr_signal` (~4 s at 2000, ~30 s at 15000), and the board's failing chat took ~4 s longer for the same 629
# positions than the same stack does on the box (12.4 s vs 8.1 s). On the box at 15000 ms the identical stack answers
# 429 / 509 / 629 / 1029 positions with 0 TDRs. So the stick gets the interval every NPU number we quote comes from:
# a host-side pause now costs a >=30 s stall instead of a backend, not the client its context. The board still owns
# the proof (`/sys/module/amdxdna/parameters/tdr_timeout_ms` = 15000 and the 400/600/1000 ladder in release-check).
#
# The parameter name is Linux 7.3+: amdxdna renamed `timeout_in_sec` to `tdr_timeout_ms` (2026-09-05 note on this
# box's own amdxdna.conf), and `modinfo -p` on the shipped module lists `tdr_timeout_ms` as (uint), so the option
# is not silently ignored. The board row is
# `/sys/module/amdxdna/parameters/tdr_timeout_ms` == 15000 on the RUNNING module - the file alone proves nothing,
# which is what `vm-check`'s `U5 npu tdr` row and container-build.sh's packed-image assertion are for.
options amdxdna tdr_timeout_ms=15000
