#
# HRX hardware gate (docs/hw-gate.md): ci.yml runs on a GPU-less GitHub runner, and the HRX
# correctness bugs #308 #309 #310 #313 #318 #319 #369 #370 were all found by hand. This job runs
# scripts/hw-gate.sh on the Strix Halo box: test-backend-ops on HRX0, tools/kat.py against
# goldens on five models (K-quants incl. the Qwen3-Coder-30B-A3B MoE, and one IQ4_XS), KLD against
# stored base logits, and the 7K-token needle on two models. It is one check on the PR (hw_gate), or
# one commit status (hw-gate) when it is started by hand.
#
# When it runs:
#   - a same-repo PR labelled `hw-gate` (adding the label starts it; later pushes re-run it);
#   - every PR bump-hrx opens (branch bump-hrx/*; that workflow opens it with a PAT, so this fires);
#   - by hand: Actions -> hw-gate -> Run workflow, with a ref (branch, tag, SHA or pull/N/head).
# PRs from forks never run here: this is a self-hosted runner on the owner's box.
#
# Runner: strixhalo-engine (the only engine runner with the pr-agent label). That is deliberate:
# the runner runs one job at a time, so no PR-Agent review (Vulkan coder-llm on :8090) generates
# while the gate's HRX dispatches run (long HRX dispatches starve that model into a ring timeout).
# The script also waits for coder-llm to be idle before each GPU step and reports any new ring
# timeout. GPU steps take no ~/npu.lock (engine#682: NPU and GPU run concurrently, engine#673),
# and run under scripts/mem-guard.sh and ~/lb/thermal-run.sh.
name: hw-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, SHA or pull/N/head to check"
        required: true
        default: main
      phases:
        description: "Phases to run (build,ops,kat,kld,needle,placement)"
        required: false
        default: build,ops,kat,kld,needle,placement

permissions:
  contents: read

jobs:
  # engine#2757: a pin bump is the change that moves the whole HRX backend under every row on the box, and a lane that bumps
  # by hand matched neither trigger below -- #2739 and #2748 both merged 11-16 with `hw_gate` skipped, so the weaker check went
  # unnoticed because a skipped workflow looks like "not applicable". A `paths:` filter on the trigger cannot be the fix on its
  # own: the job's own `if:` would still refuse (a lane branch has neither the label nor the `bump-hrx/` prefix), and a filter
  # there would also silently retire the label as a way to gate a PR that touches no pin.
  #
  # So the decision moves to a cheap hosted job that can see the diff, and the device job accepts its answer. Cost on an ordinary
  # PR: one ubuntu runner, a `git diff --name-only`, no checkout of the submodules, no ticket.
  pin_moved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      moved: ${{ steps.diff.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: Does this PR move a pin?
        run: |
          set -uo pipefail
          # FAIL CLOSED. If this job cannot tell whether a pin moved, it must not answer "no" -- a preflight that dies
          # (a fetch failure, a base ref this checkout does not have) would otherwise leave the device job SKIPPED on a
          # pin PR, i.e. the same silent hole this change exists to close, wearing a green tick. So any failure here
          # says moved=1 with a warning and lets the gate run: the expensive direction is the safe one.
          fail_closed() { echo "::warning::pin_moved could not compare, treating this PR as pin-moving so the gate runs"; echo "moved=1" >> "$GITHUB_OUTPUT"; exit 0; }
          base="origin/${{ github.base_ref }}"
          # NOT --depth=1: a shallow base has no merge base with HEAD, and `A...B` then refuses the very comparison this job is.
          git fetch --no-tags origin "${{ github.base_ref }}" || fail_closed
          # `third_party/gpu-kernels` is NOT a submodule: the kernel pin is a file (sha= in config/gpu-kernels.config), so a gk
          # bump touches that config and never a gitlink (#2753, #2586). A re-recorded golden changes what the gate compares
          # against (#2502), so it belongs here too.
          changed=$(git diff --name-only "$base...HEAD" -- \
                      third_party/llama.cpp third_party/hrx-system config/gpu-kernels.config tests/golden/hw-gate \
                    || fail_closed)
          if grep -q . <<< "$changed"; then
            echo "moved=1" >> "$GITHUB_OUTPUT"
            echo "this PR moves a pin: the gate runs"
          else
            echo "moved=0" >> "$GITHUB_OUTPUT"
            echo "no pin moved: the gate stays out unless it is labelled or dispatched"
          fi

  hw_gate:
    runs-on: [self-hosted, strixhalo, pr-agent]
    needs: [pin_moved]
    # `needs.pin_moved.outputs.moved` is empty when `pin_moved` did not run (a `workflow_dispatch`), which is why the dispatch
    # case is checked first and the label/branch routes are kept: the gate can still be asked for on a PR that moves no pin.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'hw-gate') &&
        (contains(github.event.pull_request.labels.*.name, 'hw-gate') ||
         startsWith(github.event.pull_request.head.ref, 'bump-hrx/') ||
         needs.pin_moved.outputs.moved == '1')))
    permissions:
      contents: read
      statuses: write   # by-hand runs post the hw-gate status on the commit they checked
    concurrency:
      group: hw-gate-${{ github.event.pull_request.number || inputs.ref }}
      cancel-in-progress: true
    # the gate itself takes under 20 minutes; the rest is waiting for the GPU token, a cool box and a cold build
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.ref, 'pull/') && format('refs/{0}', inputs.ref) || inputs.ref) || '' }}
          persist-credentials: false
          submodules: false

      - name: Check out the HRX pair (llama.cpp + hrx-system)
        run: |
          set -euo pipefail
          git submodule sync -- third_party/llama.cpp third_party/hrx-system
          git -c protocol.version=2 submodule update --init --depth 1 third_party/llama.cpp third_party/hrx-system
          # engine#2713: the KLD rows place each golden's `recorded_at` commit against the tested pin, and a
          # `--depth 1` clone holds neither that object nor the ancestry between them -- so every KLD row came
          # back "cannot place (...)" (INCOMPLETE, infra=1) and a labelled pin PR could not go green on any pin.
          # Measured on the same fork: the depth-1 .git is 41 MB, and unshallowing this one submodule takes 27 s
          # and 366 MB, after which all three golden bases place (234 / 16 / 7 commits behind the tested tree).
          # hrx-system is not read by the KLD rows and stays shallow. Guarded so a runner that already holds the
          # full history (a cached checkout) is a no-op rather than a `--unshallow on a complete repository` error.
          if [ "$(git -C third_party/llama.cpp rev-parse --is-shallow-repository)" = true ]; then
            git -C third_party/llama.cpp fetch --unshallow
          fi
          git submodule status -- third_party/llama.cpp third_party/hrx-system

      - name: Pending status
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=pending -f context=hw-gate -f description="HRX hardware gate running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null

      - name: HRX hardware gate
        id: gate
        env:
          HW_GATE_OUT: ${{ runner.temp }}/hw-gate
          PHASES: ${{ inputs.phases || 'build,ops,kat,kld,needle,placement' }}
        run: scripts/hw-gate.sh --phases "$PHASES"

      - name: Logs of failed checks
        if: failure()
        env:
          HW_GATE_OUT: ${{ runner.temp }}/hw-gate
        run: |
          for f in "$HW_GATE_OUT"/kat-*.txt "$HW_GATE_OUT"/needle-*.txt "$HW_GATE_OUT"/kld-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"; tail -n 60 "$f"; echo "::endgroup::"
          done
          for f in "$HW_GATE_OUT"/ops-*.log; do
            [ -f "$f" ] || continue
            grep -q FAIL "$f" || continue
            echo "::group::$(basename "$f") (failing cases)"; grep -E "FAIL|passed" "$f" | head -n 40; echo "::endgroup::"
          done

      - name: Final status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          state=failure; [ "$OUTCOME" = success ] && state=success
          gh api -X POST "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=hw-gate -f description="HRX hardware gate: $OUTCOME" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
