# Issue form: a small improvement. Larger changes start as an RFC (CONTRIBUTING.md, "RFCs").
name: Feature request
description: A small improvement to an existing command, flag or document.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New backends, new devices, new dependencies, file-format or API changes and anything
        else large start as an RFC in Discussions, not here (CONTRIBUTING.md, "RFCs").
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like 1bit to do instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways to solve it.
