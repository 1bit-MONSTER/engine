#
# Keep our Lemonade fork current (docs/lemonade.md): 1bit-MONSTER/lemonade is
# upstream lemonade-sdk/lemonade plus the onebit backend that runs the engine.
# Daily, this ports upstream's latest release (not main; Lemonade releases most
# Fridays and our weekly release builds on it) onto the fork's main:
#   - the release's own commits are cherry-picked onto main, one commit for the
#     whole port; if every one applies and onebit is still registered, it is
#     pushed to the fork's main;
#   - a commit the fork also changed is left for a person: the port is pushed to
#     a sync/<tag> branch WITHOUT the colliding files (the fork's side is kept,
#     never the release's) and a PR is opened IN THE FORK listing them.
# The tag is never merged or checked out as a branch tip. Since fork #21 the
# fork's main follows upstream's main (#3771 server refactor), while a release
# tag is cut from the older release line: merging the tag would revert main.
# Fork #27 arrived exactly that way - 524 files, -128k lines, 44 upstream commits
# and our onebit registration moved back into the release's monolithic
# server.cpp - so the port applies the release's changes to main's layout instead.
# It then disables every workflow in the fork. Upstream's build, release,
# website and PPA workflows must not run from the fork, so the port never mirrors
# upstream's workflow files at all: the fork's own .github is put back over the
# result. That also keeps the token out of the `workflow` scope.
#
# Uses the secret HRX_BUMP_TOKEN, which needs Contents, Pull requests and Actions
# read/write on 1bit-MONSTER/lemonade as well as on this repository. It does NOT need
# the Workflows permission (classic token: the `workflow` scope): the sync never
# creates or updates a workflow file, and the fork's workflows are all disabled anyway.
# Every sync from 2026-09-26 to 2026-10-05 failed because an earlier version of this job
# pushed upstream's workflow files, which GitHub refuses without that permission.
name: sync-lemonade-fork

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Prove the token's write access to the fork (branch push, PR open/close, workflow disable) and leave the fork unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-lemonade-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORK: 1bit-MONSTER/lemonade
      UPSTREAM: lemonade-sdk/lemonade
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - name: Self-test the token's write access to the fork
        if: ${{ inputs.selftest }}
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          branch="sync-selftest/${GITHUB_RUN_ID}"
          git clone -q --filter=blob:none --depth 1 "https://x-access-token:${TOKEN}@github.com/${FORK}.git" st
          cd st
          git push -q origin "HEAD:refs/heads/${branch}"
          echo "PASS contents: pushed ${branch}"
          git config user.name "lemonade-fork-sync"
          git config user.email "lemonade-fork-sync@users.noreply.github.com"
          git commit -q --allow-empty -m "sync self-test (empty commit, closed and deleted by the same run)"
          git push -q origin "HEAD:refs/heads/${branch}"
          url=$(gh pr create --repo "$FORK" --base main --head "$branch" --draft \
                  --title "sync self-test ${GITHUB_RUN_ID}" --body "Opened and closed by the self-test in 1bit-MONSTER/engine's sync-lemonade-fork workflow.")
          gh pr close "$url" --repo "$FORK" --delete-branch > /dev/null
          echo "PASS pull requests: opened and closed ${url}"
          git ls-remote --exit-code origin "refs/heads/${branch}" > /dev/null && { echo "::error::self-test branch was not deleted"; exit 1; }
          echo "PASS contents: deleted ${branch}"
          id=$(gh api "repos/${FORK}/actions/workflows" --jq '.workflows[0].id')
          # Disabling an already-disabled workflow is refused, so enable it and
          # disable it again: the same permission, and the fork ends as it started.
          gh api -X PUT "repos/${FORK}/actions/workflows/${id}/enable" > /dev/null
          gh api -X PUT "repos/${FORK}/actions/workflows/${id}/disable" > /dev/null
          echo "PASS actions: enabled and disabled workflow ${id}"
          echo "SELFTEST PASSED: the token can do everything the sync needs"

      - name: Port upstream's latest release into the fork
        if: ${{ !inputs.selftest }}
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none "https://x-access-token:${TOKEN}@github.com/${FORK}.git" fork
          cd fork
          git config user.name "lemonade-fork-sync"
          git config user.email "lemonade-fork-sync@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)   # latest, never a pre-release
          git fetch -q upstream "refs/tags/${tag}:refs/tags/${tag}"
          up=$(git rev-parse "${tag}^{commit}")
          before=$(git rev-parse HEAD)
          # Three ways this release can already be in the fork, cheapest first.
          #
          # 1. The tag is on main's own lineage (the pre-#3771 world: the fork followed
          #    upstream's releases). Then it is simply an ancestor and there is nothing to do.
          if git merge-base --is-ancestor "$up" HEAD; then
            echo "fork already contains upstream ${tag} (${up:0:12})"
            exit 0
          fi
          # 2. The tag was already ported and its PR merged. This is the case that matters since
          #    fork #21: main follows upstream's *main* (the #3771 server refactor) while every
          #    release tag is cut from the older release line, so a ported release is never an
          #    ancestor and its commits are never patch-equivalent (the port lands in the
          #    refactored files, e.g. services/model_options.cpp, not the release's server.cpp).
          #    The sync branch is deleted when its PR merges, so the merged PR - not a branch
          #    probe - is the durable record that this tag has been handed over.
          merged=$(gh pr list --repo "$FORK" --state merged --head "sync/${tag}" --json number --jq '.[0].number // ""')
          if [ -n "$merged" ]; then
            echo "${tag} was already ported in ${FORK}#${merged}"
            exit 0
          fi
          # 3. A previous run already handed this tag over and its PR is still open: the branch is
          #    the record, and a second port would only add a duplicate commit.
          branch="sync/${tag}"
          if git ls-remote --exit-code origin "refs/heads/${branch}" > /dev/null; then
            echo "${branch} exists: ${tag} is already waiting for a person on that branch"
            exit 0
          fi
          # 4. Nothing left to apply: every commit the tag has and main lacks is already in main
          #    by patch (`git cherry` marks those '-'; this is the pre-refactor case, where the
          #    port is a cherry-pick of the same change).
          picks=$(git cherry HEAD "$up" | awk '$1 == "+" { print $2 }')
          if [ -z "$picks" ]; then
            echo "fork already carries upstream ${tag} (${up:0:12}) by patch"
            exit 0
          fi
          # keep_fork_github: put the fork's own .github back over whatever the port
          # produced. The fork disables every workflow it has (last step), so mirroring
          # upstream's workflow files buys nothing — and GitHub refuses a push that
          # creates or updates .github/workflows unless the token carries the `workflow`
          # scope, which is why every sync from 2026-09-26 failed.
          keep_fork_github() {
            git rm -rq --cached .github 2>/dev/null || true
            git checkout "$before" -- .github
            git clean -fdq -- .github 2>/dev/null || true
          }
          # Port the release's own contribution onto main; never check the tag out into the
          # branch. The tag's *tree* is the release line, which predates the #3771 refactor:
          # merging it would revert everything main gained since the release branch was cut -
          # fork #27 arrived that way, as a 524-file, -128k-line revert of 44 commits that also
          # moved our onebit registration back into the release's monolithic server.cpp. Taking
          # the commits git cherry marked '+' applies the release's changes to main's layout,
          # which is what a pin actually needs.
          git checkout -q -b "$branch" "$before"
          conflicts=()
          for c in $picks; do
            # a merge inside the release range carries no patch of its own; the commits around it
            # hold its content (git cherry reports it as '+' with an empty patch id)
            if git rev-list --no-walk --merges "$c" | grep -q .; then
              continue
            fi
            if git cherry-pick -x "$c" > /dev/null 2>&1; then
              continue
            fi
            mapfile -t changed < <(git diff --name-only --diff-filter=U)
            if [ "${#changed[@]}" -eq 0 ]; then
              # failed without a content conflict (already applied, or an empty patch): drop it
              GIT_EDITOR=true git cherry-pick --skip > /dev/null 2>&1 || git cherry-pick --abort
              continue
            fi
            # The release and the fork both changed these files. Keep the fork's side: a sync
            # branch may never revert main, and a person finishes the port from the release's
            # version, which stays in commit $c. The branch is then main plus everything the
            # release added that did not collide, and it does not have to build until the
            # listed files are resolved.
            conflicts+=("${changed[@]}")
            git checkout --ours -- "${changed[@]}" 2>/dev/null || true
            git add -A -- "${changed[@]}"
            GIT_EDITOR=true git cherry-pick --continue > /dev/null
          done
          # One commit for the port, as the old merge produced: main's history stays one line per
          # upstream release. keep_fork_github for the same reason as before - the push must not
          # create or update a workflow file.
          git reset -q --soft "$before"
          keep_fork_github
          if [ "${#conflicts[@]}" -eq 0 ]; then
            git commit -q -m "Sync upstream ${UPSTREAM} ${tag} (${up:0:12})"
            # The fork exists for the onebit backend: never push a port that lost it.
            grep -q '"onebit|onebit"' CMakeLists.txt || { echo "::error::onebit is no longer registered after the port"; exit 1; }
            test -f src/cpp/server/backends/onebit/onebit_server.cpp || { echo "::error::onebit_server.cpp is gone after the port"; exit 1; }
            git push -q origin HEAD:main
            echo "ported upstream ${tag} (${up:0:12}) into ${FORK} main"
          else
            git commit -q -m "Sync upstream ${UPSTREAM} ${tag} (conflicts; the fork's side is kept)"
            conflict_list=$(printf '%s\n' "${conflicts[@]}" | sort -u | sed 's/^/- /')
            git push -q origin "${branch}:refs/heads/${branch}"
            gh pr create --repo "$FORK" --base main --head "$branch" \
              --title "Sync upstream ${UPSTREAM} ${tag} (conflicts)" \
              --body "Upstream release ${tag} (\`${up:0:12}\`) ported onto \`main\` (\`${before:0:12}\`), not merged as a tag. The release line predates the #3771 refactor, so the tag's tree is not a newer main: merging it would revert main (fork #27 arrived as a 524-file, -128k-line revert that way). The port keeps main plus every release change that applied cleanly.

          Files the release also changed, kept on the fork's side (the release's version is in \`${up:0:12}\`):

          ${conflict_list}

          Resolve them in main's layout - for 44.1 that meant \`services/model_options.cpp\` and \`docs/api/openai.md\`, not the release's \`server.cpp\`/\`docs/api/lemonade.md\` - rebuild, run Lemonade's LLM suite through the onebit recipe on Strix Halo, and merge."
          fi

      - name: Keep the fork's workflows disabled
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent on purpose. A workflow that is already disabled, or that GitHub manages
          # (dynamic workflows), answers HTTP 422 to a disable request. Under `set -e` that aborted
          # the whole sync job -- and because the self-test just re-enabled and re-disabled a
          # workflow, the very next run saw it still listed as active and died here. Report and
          # continue; never fail the sync over a cleanup step.
          skipped=0
          for id in $(gh api "repos/${FORK}/actions/workflows" --paginate --jq '.workflows[] | select(.state=="active") | .id'); do
            if gh api -X PUT "repos/${FORK}/actions/workflows/${id}/disable" > /dev/null 2>&1; then
              echo "disabled workflow ${id}"
            else
              echo "workflow ${id} left as-is (already disabled, or GitHub-managed)"
              skipped=$((skipped+1))
            fi
          done
          echo "workflow cleanup complete; ${skipped} left as-is"
