# The workflows' actions are pinned by commit (the repository requires it); Dependabot proposes
# the new commit when an action releases, as a PR the usual checks run on.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "actions"
