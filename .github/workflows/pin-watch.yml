#
# The daily model-pin watch (docs/model-pins.md): compare every pin in models/pins.json with the
# upstream repo's current main, re-read the chat template of anything that moved, and open ONE PR per
# changed repo bumping that repo's pin, with the report as the body. Adoption is a reviewed merge; this
# workflow never touches the catalogue, the stick image or a scoreboard row.
#
# Uses the same HRX_BUMP_TOKEN as the bump and census workflows: a PR opened with GITHUB_TOKEN would not
# run CI. That token also lifts Hugging Face's anonymous rate limit where the range reads need it.

name: pin-watch

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-watch
  cancel-in-progress: false

jobs:
  pin-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare every pin with its upstream
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -uo pipefail
          # exit 1 means "a pin moved", which is the normal case this workflow exists for
          rc=0
          # --orgs also censuses our own orgs: a model published tomorrow is pinned by nobody until it is
          # the JSON beside the report is the same sweep, so the PR step below does not repeat it
          python3 tools/pin_watch.py --check --orgs 1bit-MONSTER,bong-water-water-bong --out pin-report.md --json pin-report.json || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          echo "moved=$(grep -c '^## `' pin-report.md || true)" >> "$GITHUB_OUTPUT"
          # a pin nobody could read, or a published repo nobody pinned, is not a clean day: annotate the
          # run with the report's own first line instead of leaving it to whoever opens the summary
          if head -1 pin-report.md | grep -Eq 'not checked|not pinned'; then
            echo "::warning::$(head -1 pin-report.md) — see the summary"
          fi
          cat pin-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open one pin bump per changed repo
        if: steps.check.outputs.moved != '0'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          git config user.name "pin-watch"
          git config user.email "pin-watch@users.noreply.github.com"
          grep '^## `' pin-report.md | sed 's/^## `//; s/`$//' | while read -r repo; do
            slug=$(echo "$repo" | tr '/.' '--')
            branch="pin-watch/$slug-$day"
            if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
              echo "$branch already exists"; continue
            fi
            # -C, not -c: a bump that failed earlier in this run left its branch behind, and a
            # "branch already exists" abort here would leave every later repo unbumped
            git switch -C "$branch" main --quiet
            rc=0
            python3 tools/pin_watch.py --bump "$repo" || rc=$?
            if [ "$rc" -eq 4 ]; then
              # gone upstream, or a tracked file did: the report says so, and a human decides
              echo "::warning::$repo needs a human decision (see the report); no bump opened"
              git checkout -- models/pins.json 2>/dev/null || true
              git switch main --quiet
              continue
            elif [ "$rc" -ne 0 ]; then
              # anything else is an unread upstream, which is not a clean day
              echo "::error::$repo could not be bumped (rc=$rc): this run is not a clean one"
              exit 1
            fi
            # no `|| true`: a body that could not be produced is a broken report, not an empty PR
            python3 tools/pin_watch.py --pr-body "$repo" --from pin-report.json > body.md
            newsha=$(python3 -c 'import json,sys; print(json.load(open("models/pins.json"))["pins"][sys.argv[1]]["commit"][:8])' "$repo")
            git add models/pins.json
            git commit -q -m "pin: $repo at $newsha"
            git push -q origin "$branch"
            gh pr create --base main --head "$branch" --title "Pin: $repo" --body-file body.md
            git switch main --quiet
          done
