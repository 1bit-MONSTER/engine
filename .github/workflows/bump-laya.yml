#
# Keep Laya current (docs/laya.md): when NandhaKishorM/laya main or the
# convaiinnovations/laya model repo on Hugging Face moves, open a PR that moves
# third_party/laya and config/laya.json's revision together. Before merging,
# run scripts/fetch-laya.sh and the Laya tests against the new revision.
#
# Uses the secret HRX_BUMP_TOKEN (Contents and Pull requests read/write on
# 1bit-MONSTER/engine): a PR opened with the default GITHUB_TOKEN would not
# start CI.
name: bump-laya

on:
  schedule:
    - cron: "53 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-laya
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with upstream
        id: pins
        run: |
          set -euo pipefail
          src=$(git ls-remote https://github.com/NandhaKishorM/laya.git refs/heads/main | awk '{print $1}')
          repo=$(python3 -c 'import json; print(json.load(open("config/laya.json"))["repo"])')
          rev=$(curl -fsSL "https://huggingface.co/api/models/${repo}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          our_src=$(git ls-tree HEAD third_party/laya | awk '{print $3}')
          our_rev=$(python3 -c 'import json; print(json.load(open("config/laya.json"))["revision"])')
          echo "source $src (ours $our_src), model $rev (ours $our_rev)"
          {
            echo "src=$src"; echo "rev=$rev"; echo "our_src=$our_src"; echo "our_rev=$our_rev"
            if [ "$src" = "$our_src" ] && [ "$rev" = "$our_rev" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          SRC: ${{ steps.pins.outputs.src }}
          REV: ${{ steps.pins.outputs.rev }}
          OUR_SRC: ${{ steps.pins.outputs.our_src }}
          OUR_REV: ${{ steps.pins.outputs.our_rev }}
        run: |
          set -euo pipefail
          branch="bump-laya/${SRC:0:8}-${REV:0:8}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          git config user.name "laya-bump"
          git config user.email "laya-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$SRC,third_party/laya"
          python3 - "$REV" <<'PY'
          import json, sys
          p = json.load(open("config/laya.json")); p["revision"] = sys.argv[1]
          open("config/laya.json", "w").write(json.dumps(p, indent=2) + "\n")
          PY
          git add config/laya.json
          git commit -q -m "Bump Laya: source ${SRC:0:12}, model ${REV:0:12}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump Laya: source ${SRC:0:8}, model ${REV:0:8}" \
            --body "third_party/laya: \`${OUR_SRC:0:12}\` -> \`${SRC:0:12}\` (NandhaKishorM/laya main). config/laya.json revision: \`${OUR_REV:0:12}\` -> \`${REV:0:12}\` (convaiinnovations/laya).

          Before merging: scripts/fetch-laya.sh <dir> (verifies every file) and the Laya tests."
