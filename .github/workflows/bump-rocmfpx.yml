#
# Keeps third_party/llama.cpp-rocmfpx (the lean option, docs/lean.md) on upstream
# charlie12345/ROCmFPX's main: once a week, when main has moved, it opens a PR here
# moving the submodule. ROCmFPX publishes no releases, and its main moves many times a
# day, so weekly. GitHub-hosted CI has no GPU: rerun docs/lean.md's table on Strix Halo
# before merging.
#
# The private ROCmFPX tree -DONEBIT_GPU_PRIVATE builds (1bit-MONSTER/gpu-kernels) is not
# moved from here; that repository keeps its own pin.
#
# Uses the secret HRX_BUMP_TOKEN (Contents and Pull requests read/write on
# 1bit-MONSTER/engine): a PR opened with the default GITHUB_TOKEN would not start CI.
name: bump-rocmfpx

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-rocmfpx
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token
        env:
          HRX_BUMP_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          if [ -z "$HRX_BUMP_TOKEN" ]; then
            echo "::error::secret HRX_BUMP_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HRX_BUMP_TOKEN }}

      - name: Compare with ROCmFPX main
        id: pins
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/charlie12345/ROCmFPX/commits/main --jq .sha)
          ours=$(git ls-tree HEAD third_party/llama.cpp-rocmfpx | awk '{print $3}')
          echo "upstream ${upstream}, ours ${ours}"
          {
            echo "upstream=$upstream"; echo "ours=$ours"
            if [ "$upstream" = "$ours" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HRX_BUMP_TOKEN }}
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          OURS: ${{ steps.pins.outputs.ours }}
        run: |
          set -euo pipefail
          branch="bump-rocmfpx/${UPSTREAM:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          count=$(gh api "repos/charlie12345/ROCmFPX/compare/${OURS}...${UPSTREAM}" --jq .ahead_by 2>/dev/null || echo "?")
          git config user.name "rocmfpx-bump"
          git config user.email "rocmfpx-bump@users.noreply.github.com"
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$UPSTREAM,third_party/llama.cpp-rocmfpx"
          git commit -q -m "Bump ROCmFPX (lean): charlie12345/ROCmFPX ${UPSTREAM:0:12}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump ROCmFPX (lean): ${UPSTREAM:0:12}" \
            --body "Moves third_party/llama.cpp-rocmfpx from \`${OURS:0:12}\` to ROCmFPX main \`${UPSTREAM:0:12}\` (${count} commits).

          CI here has no GPU. Before merging, on Strix Halo: build with \`-DONEBIT_LEAN=ON -DONEBIT_LEAN_ROCM=ON\`, run \`ctest -R serve_e2e_lean\`, and rerun the table in docs/lean.md."
