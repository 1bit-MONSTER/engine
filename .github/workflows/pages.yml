#
# The site, https://1bit.gg/ (custom domain of this repository's GitHub Pages): tools/site.py renders
# README.md and docs/*.md with site/template.html and site/style.css. Pull requests only
# build it (a doc that breaks the site shows up in review); main deploys it to GitHub Pages.
# The repository variable GOATCOUNTER (a GoatCounter site code) turns on visitor counts.
# The repository variable CONTEXT7_LIBRARY (e.g. /1bit-monster/engine) turns on the docs chat widget.
name: pages

on:
  push:
    branches: [main]
    paths: [README.md, "docs/**", "blog/**", "site/**", tools/site.py, .github/workflows/pages.yml]
  pull_request:
    paths: [README.md, "docs/**", "blog/**", "site/**", tools/site.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        env:
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}
          CONTEXT7_LIBRARY: ${{ vars.CONTEXT7_LIBRARY }}
        run: |
          python3 -m pip install --quiet markdown==3.10.3
          python3 tools/site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
